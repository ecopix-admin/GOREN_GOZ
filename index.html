<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzSearch</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --border-color: #232d3f;
            --accent-color: #3b82f6;
            --text-color: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px;
        }

        .ad-banner {
            width: 100%;
            max-width: 728px;
            background-color: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .main-container {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--accent-color);
        }

        /* Axtarış Qutusu və Təkliflər */
        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-box {
            width: 100%;
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 4px;
            transition: 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 1rem;
            padding: 10px 18px;
        }

        .search-box button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        /* Təkliflər Siyahısı (Suggestions Dropdown) */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-top: 6px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .suggestion-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #cbd5e1;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: #1e293b;
            color: var(--accent-color);
        }

        .history-tag {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Sadə Düymələr */
        .quick-links {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }

        .link-card:hover {
            border-color: var(--accent-color);
            color: var(--text-color);
        }

        footer {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="ad-banner">
        REKLAM SAHƏSİ 1
    </div>

    <div class="main-container">
        <div class="logo">Az<span>Search</span></div>

        <div class="search-wrapper">
            <form class="search-box" id="searchForm" action="https://www.google.com/search" method="GET" target="_blank">
                <input type="text" id="searchInput" name="q" placeholder="Axtarın..." autocomplete="off" required>
                <button type="submit">Axtar</button>
            </form>

            <div class="suggestions-list" id="suggestions"></div>
        </div>

        <div class="quick-links">
            <a href="https://www.youtube.com" class="link-card" target="_blank">YouTube</a>
            <a href="https://www.instagram.com" class="link-card" target="_blank">Instagram</a>
            <a href="https://www.wikipedia.org" class="link-card" target="_blank">Wikipedia</a>
            <a href="https://web.telegram.org" class="link-card" target="_blank">Telegram</a>
        </div>
    </div>

    <div class="ad-banner">
        REKLAM SAHƏSİ 2
    </div>

    <footer>
        &copy; 2026 AzSearch Engine
    </footer>

    <script>
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');
        const searchForm = document.getElementById('searchForm');

        // Yaddaşda Maksimum 15 Söz Saxlamaq
        const MAX_HISTORY = 15;

        function getHistory() {
            return JSON.parse(localStorage.getItem('searchHistory') || '[]');
        }

        function saveToHistory(query) {
            if (!query) return;
            let history = getHistory();
            history = history.filter(item => item.toLowerCase() !== query.toLowerCase());
            history.unshift(query);
            if (history.length > MAX_HISTORY) history.pop();
            localStorage.setItem('searchHistory', JSON.stringify(history));
        }

        // Axtarış düyməsinə basıldıqda yaddaşa vurur
        searchForm.addEventListener('submit', function() {
            saveToHistory(searchInput.value.trim());
        });

        // İstifadəçi daxil edəndə Google Təkliflərini Canlı Çəkir
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();

            if (query.length === 0) {
                showHistory();
                return;
            }

            // Google Autocomplete API
            const script = document.createElement('script');
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleSuggestions`;
            document.body.appendChild(script);
            document.body.removeChild(script);
        });

        // Təklifləri göstərən funksiya
        window.handleSuggestions = function(data) {
            const results = data[1];
            suggestionsBox.innerHTML = '';

            if (results.length > 0) {
                results.slice(0, 7).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `<span>${item}</span>`;
                    div.onclick = function() {
                        searchInput.value = item;
                        saveToHistory(item);
                        searchForm.submit();
                    };
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        };

        // Yaddaşdakı son axtarışları göstərir
        function showHistory() {
            const history = getHistory();
            suggestionsBox.innerHTML = '';

            if (history.length > 0) {
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `<span>${item}</span> <span class="history-tag">Keçmiş</span>`;
                    div.onclick = function() {
                        searchInput.value = item;
                        searchForm.submit();
                    };
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        }

        searchInput.addEventListener('focus', function() {
            if (this.value.trim().length === 0) {
                showHistory();
            }
        });

        // Kənara vuranda menyu bağlansın
        document.addEventListener('click', function(e) {
            if (!searchForm.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
