<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAM & Social Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --border-color: #262626;
            --text-main: #f5f5f5;
            --text-muted: #a8a8a8;
            --accent-color: #0095f6;
            --like-color: #ff3040;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 245px;
            padding: 24px 12px;
            border-right: 1px solid var(--border-color);
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            padding: 0 12px 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .brand-logo span {
            color: var(--accent-color);
            font-size: 30px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            color: var(--text-main);
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: background 0.2s;
            cursor: pointer;
        }

        .nav-item a:hover {
            background-color: #1a1a1a;
        }

        .nav-item i {
            font-size: 20px;
            width: 24px;
        }

        /* Main Content */
        .main-content {
            margin-left: 245px;
            width: 100%;
            max-width: 630px;
            padding: 20px;
        }

        /* Stories Bar */
        .stories-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 16px 0;
            margin-bottom: 24px;
            scrollbar-width: none;
        }

        .stories-container::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-avatar-wrapper {
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-radius: 50%;
        }

        .story-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
            object-fit: cover;
        }

        .story-username {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 64px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Post Card */
        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-username {
            font-size: 14px;
            font-weight: 600;
        }

        .post-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            display: block;
        }

        .post-actions {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
        }

        .action-btns {
            display: flex;
            gap: 16px;
        }

        .action-btns i, .post-actions > i {
            font-size: 22px;
            cursor: pointer;
        }

        .fa-heart.active { color: var(--like-color); }
        .fa-bookmark.active { color: var(--text-main); }

        .post-details {
            padding: 0 16px 16px;
        }

        .likes-count {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .caption {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .caption .username {
            font-weight: 600;
            margin-right: 6px;
        }

        .comments-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
        }

        .add-comment-box {
            display: flex;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            gap: 10px;
        }

        .add-comment-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            width: 100%;
            font-size: 14px;
        }

        .add-comment-box button {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-weight: 600;
            cursor: pointer;
        }

        /* Modal Overlays (Yarat, Profil & Ayarlar) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .close-btn {
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-body input[type="text"], .modal-body textarea {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
        }

        .modal-body button {
            padding: 10px;
            background: var(--accent-color);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar .link-text, .brand-logo div { display: none; }
            .main-content { margin-left: 70px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div>
                <div class="brand-logo" onclick="window.scrollTo(0,0)">
                    <span>&</span> <div class="link-text">SHAM</div>
                </div>
                <ul class="nav-links">
                    <li class="nav-item"><a onclick="window.scrollTo(0,0)"><i class="fa-solid fa-house"></i><span class="link-text">Ana Səhifə</span></a></li>
                    <li class="nav-item"><a onclick="toggleModal('searchModal')"><i class="fa-solid fa-magnifying-glass"></i><span class="link-text">Axtarış</span></a></li>
                    <li class="nav-item"><a onclick="toggleModal('notifModal')"><i class="fa-regular fa-heart"></i><span class="link-text">Bildirişlər</span></a></li>
                    <li class="nav-item"><a onclick="toggleModal('createModal')"><i class="fa-regular fa-square-plus"></i><span class="link-text">Yarat</span></a></li>
                    <li class="nav-item"><a onclick="toggleModal('profileModal')"><i class="fa-regular fa-user"></i><span class="link-text">Profil & Ayarlar</span></a></li>
                </ul>
            </div>
        </aside>

        <!-- Main Feed -->
        <main class="main-content">
            <div class="stories-container" id="stories-wrapper"></div>
            <div id="feed-posts"></div>
        </main>
    </div>

    <!-- Modallar -->
    <!-- 1. Yarat (Post Paylaş) -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Yeni Paylaşım Yaradın</h3>
                <i class="fa-solid fa-xmark close-btn" onclick="toggleModal('createModal')"></i>
            </div>
            <div class="modal-body">
                <input type="file" id="postImageInput" accept="image/*">
                <textarea id="postCaptionInput" placeholder="Açıqlama yazın..." rows="3"></textarea>
                <button onclick="publishUserPost()">Paylaş</button>
            </div>
        </div>
    </div>

    <!-- 2. Profil və Ayarlar -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Profil Tənzimləmələri</h3>
                <i class="fa-solid fa-xmark close-btn" onclick="toggleModal('profileModal')"></i>
            </div>
            <div class="modal-body">
                <label>İstifadəçi Adı:</label>
                <input type="text" id="usernameInput" value="sham_user">
                <label>Profil Şəkli (İstənilən Şəkil Seçin):</label>
                <input type="file" id="avatarFileInput" accept="image/*">
                <button onclick="saveProfile()">Yadda Saxla</button>
            </div>
        </div>
    </div>

    <!-- 3. Axtarış Modal -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Axtarış</h3>
                <i class="fa-solid fa-xmark close-btn" onclick="toggleModal('searchModal')"></i>
            </div>
            <div class="modal-body">
                <input type="text" placeholder="İstifadəçi və ya haştaq axtarın...">
            </div>
        </div>
    </div>

    <!-- 4. Bildirişlər Modal -->
    <div class="modal" id="notifModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Bildirişlər</h3>
                <i class="fa-solid fa-xmark close-btn" onclick="toggleModal('notifModal')"></i>
            </div>
            <div class="modal-body">
                <p style="color: var(--text-muted);">Yeni bildirişiniz yoxdur.</p>
            </div>
        </div>
    </div>

    <script>
        // İstifadəçi Profil Verilənləri (LocalStorage ilə)
        let currentUser = JSON.parse(localStorage.getItem('sham_profile')) || {
            username: "sham_master",
            avatar: "https://picsum.photos/seed/sham_main/100/100"
        };

        const defaultUsers = ["alex_vibe", "creative_mind", "urban_lens", "tech_insider", "nature_art"];
        const captions = ["Möhtəşəm gün! 🔥 #sham", "Yaradıcılıq heç vaxt bitmir ✨", "Kod və dizayn ahəngi 🚀"];

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function saveProfile() {
            const newName = document.getElementById('usernameInput').value;
            const avatarFile = document.getElementById('avatarFileInput').files[0];

            if(newName) currentUser.username = newName;

            if(avatarFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUser.avatar = e.target.result;
                    localStorage.setItem('sham_profile', JSON.stringify(currentUser));
                    alert("Profil yeniləndi!");
                    toggleModal('profileModal');
                };
                reader.readAsDataURL(avatarFile);
            } else {
                localStorage.setItem('sham_profile', JSON.stringify(currentUser));
                alert("Profil yeniləndi!");
                toggleModal('profileModal');
            }
        }

        // Hekayələr
        function generateStories() {
            const wrapper = document.getElementById('stories-wrapper');
            let storiesHTML = `
                <div class="story-item" onclick="toggleModal('profileModal')">
                    <div class="story-avatar-wrapper" style="background: var(--border-color);">
                        <img src="${currentUser.avatar}" class="story-avatar">
                    </div>
                    <span class="story-username">Siz</span>
                </div>
            `;
            
            for(let i = 1; i <= 10; i++) {
                const user = defaultUsers[i % defaultUsers.length] + "_" + i;
                const avatarUrl = `https://picsum.photos/seed/story_${i}/150/150`;
                storiesHTML += `
                    <div class="story-item">
                        <div class="story-avatar-wrapper">
                            <img src="${avatarUrl}" class="story-avatar">
                        </div>
                        <span class="story-username">${user}</span>
                    </div>
                `;
            }
            wrapper.innerHTML = storiesHTML;
        }

        // Real Paylaşım Etmək
        function publishUserPost() {
            const fileInput = document.getElementById('postImageInput');
            const captionInput = document.getElementById('postCaptionInput');

            if(!fileInput.files[0]) {
                alert("Xahiş olunur bir şəkil seçin!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const newPost = {
                    id: Date.now(),
                    username: currentUser.username,
                    avatar: currentUser.avatar,
                    image: e.target.result,
                    caption: captionInput.value,
                    likes: 1
                };

                // Yaddaşa yaz
                let userPosts = JSON.parse(localStorage.getItem('sham_user_posts')) || [];
                userPosts.unshift(newPost);
                localStorage.setItem('sham_user_posts', JSON.stringify(userPosts));

                // Ekrana çıxart
                renderPost(newPost, true);

                // Temizle və bagla
                fileInput.value = "";
                captionInput.value = "";
                toggleModal('createModal');
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function createPostHTML(post) {
            return `
                <article class="post-card" id="post-${post.id}">
                    <div class="post-header">
                        <div class="post-user-info">
                            <img src="${post.avatar}" class="post-avatar">
                            <span class="post-username">${post.username}</span>
                        </div>
                        <i class="fa-solid fa-ellipsis"></i>
                    </div>
                    <img src="${post.image}" class="post-image">
                    <div class="post-actions">
                        <div class="action-btns">
                            <i class="fa-regular fa-heart" onclick="toggleLike(this, ${post.id})"></i>
                            <i class="fa-regular fa-comment"></i>
                            <i class="fa-regular fa-paper-plane"></i>
                        </div>
                        <i class="fa-regular fa-bookmark" onclick="toggleBookmark(this)"></i>
                    </div>
                    <div class="post-details">
                        <div class="likes-count" id="likes-${post.id}">${post.likes} bəyənmə</div>
                        <div class="caption">
                            <span class="username">${post.username}</span> ${post.caption}
                        </div>
                        <div class="comments-section" id="comments-${post.id}"></div>
                    </div>
                    <div class="add-comment-box">
                        <input type="text" placeholder="Şərh əlavə et..." id="input-${post.id}">
                        <button onclick="addComment(${post.id})">Paylaş</button>
                    </div>
                </article>
            `;
        }

        function renderPost(post, prepend = false) {
            const feed = document.getElementById('feed-posts');
            if(prepend) {
                feed.insertAdjacentHTML('afterbegin', createPostHTML(post));
            } else {
                feed.insertAdjacentHTML('beforeend', createPostHTML(post));
            }
        }

        function toggleLike(element, postId) {
            const likesElem = document.getElementById(`likes-${postId}`);
            let currentLikes = parseInt(likesElem.innerText);

            if(element.classList.contains('fa-regular')) {
                element.classList.remove('fa-regular');
                element.classList.add('fa-solid', 'active');
                likesElem.innerText = `${currentLikes + 1} bəyənmə`;
            } else {
                element.classList.remove('fa-solid', 'active');
                element.classList.add('fa-regular');
                likesElem.innerText = `${currentLikes - 1} bəyənmə`;
            }
        }

        function toggleBookmark(element) {
            element.classList.toggle('fa-regular');
            element.classList.toggle('fa-solid');
            element.classList.toggle('active');
        }

        function addComment(postId) {
            const input = document.getElementById(`input-${postId}`);
            const commentsContainer = document.getElementById(`comments-${postId}`);
            
            if(input.value.trim() !== "") {
                const commentDiv = document.createElement('div');
                commentDiv.style.marginTop = "4px";
                commentDiv.innerHTML = `<strong>${currentUser.username}:</strong> ${input.value}`;
                commentsContainer.appendChild(commentDiv);
                input.value = "";
            }
        }

        // İlk Yüklənmə
        let postCounter = 1;
        function initFeed() {
            generateStories();
            
            // İstifadəçinin öz yaddaşda olan postları
            let userPosts = JSON.parse(localStorage.getItem('sham_user_posts')) || [];
            userPosts.forEach(post => renderPost(post));

            // Avto saxta postlar
            for(let i = 0; i < 5; i++) {
                const fakePost = {
                    id: postCounter,
                    username: defaultUsers[i % defaultUsers.length] + "_" + postCounter,
                    avatar: `https://picsum.photos/seed/avatar_${postCounter}/100/100`,
                    image: `https://picsum.photos/seed/post_${postCounter}/600/600`,
                    caption: captions[i % captions.length],
                    likes: Math.floor(Math.random() * 500) + 10
                };
                renderPost(fakePost);
                postCounter++;
            }
        }

        window.onload = initFeed;
    </script>
</body>
</html>
