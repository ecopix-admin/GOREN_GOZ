<!DOCTYPE html>
<html lang="az" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gboard 2030 - F1 Cockpit Edition</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0d14',
                            surface: '#121824',
                            accent: '#00f0ff',
                            secondary: '#ff007f'
                        }
                    }
                }
            }
        };
    </script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #080a0f;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-window {
            background: rgba(15, 20, 32, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 15px rgba(var(--theme-glow-rgb, 0, 240, 255), 0.3);
        }

        .keyboard-key {
            position: relative;
            background: var(--key-bg, rgba(255, 255, 255, 0.07));
            border: 1px solid var(--key-border, rgba(255, 255, 255, 0.08));
            color: var(--key-text, #f1f5f9);
            border-radius: 0.625rem;
            box-shadow: 0 3px 0 var(--key-shadow, rgba(0,0,0,0.4)), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: transform 0.06s ease, background-color 0.1s ease, box-shadow 0.06s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 1.15rem;
            cursor: pointer;
            overflow: hidden;
        }

        .keyboard-key:active, .keyboard-key.key-pressed {
            transform: scale(0.88) translateY(2px);
            box-shadow: 0 0 12px var(--theme-accent, #00f0ff), inset 0 1px 0 rgba(255,255,255,0.3);
            background: var(--key-active-bg, rgba(0, 240, 255, 0.25)) !important;
            color: #ffffff;
        }

        .keyboard-key.special-key {
            background: var(--special-key-bg, rgba(255, 255, 255, 0.12));
            font-size: 0.9rem;
            font-weight: 600;
        }

        .keyboard-key.action-key {
            background: var(--theme-accent, #00f0ff);
            color: #000000;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.5), 0 0 10px var(--theme-accent, #00f0ff);
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }

        #f1-canvas {
            position: absolute;
            top: -12px;
            left: -12px;
            width: calc(100% + 24px);
            height: calc(100% + 24px);
            pointer-events: none;
            z-index: 30;
            border-radius: 2.2rem;
        }

        .accent-popup {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            opacity: 0;
            pointer-events: none;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid var(--theme-accent, #00f0ff);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px var(--theme-accent, #00f0ff);
            border-radius: 0.75rem;
            display: flex;
            gap: 0.25rem;
            padding: 0.35rem;
            z-index: 100;
        }

        .accent-popup.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) scale(1);
        }

        .accent-option {
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            background: rgba(255,255,255,0.05);
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .accent-option:hover, .accent-option:active {
            background: var(--theme-accent, #00f0ff);
            color: black;
        }

        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .resize-handle {
            position: absolute;
            right: 2px;
            bottom: 2px;
            width: 16px;
            height: 16px;
            cursor: se-resize;
            border-right: 2px solid var(--theme-accent, #00f0ff);
            border-bottom: 2px solid var(--theme-accent, #00f0ff);
        }

        .subscript-symbol {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.6rem;
            opacity: 0.5;
            font-weight: 400;
        }

        .window-open {
            animation: windowPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .window-close {
            animation: windowShrink 0.2s ease-in forwards;
        }

        @keyframes windowPop {
            0% { opacity: 0; transform: scale(0.7) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes windowShrink {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.7) translateY(20px); }
        }

        .nitro-boost {
            box-shadow: 0 0 35px var(--theme-accent, #00f0ff), inset 0 0 15px rgba(255,255,255,0.5) !important;
        }

        /* Virtual Cursor Blink */
        .custom-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: var(--theme-accent, #00f0ff);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="h-full w-full flex flex-col justify-between overflow-hidden bg-slate-950 text-slate-100 antialiased">

    <!-- TOP SECTION: DISPLAY AREA -->
    <main class="flex-1 flex flex-col p-3 max-w-4xl w-full mx-auto relative z-10 min-h-0">
        <header class="flex items-center justify-between pb-2 border-b border-slate-800/80 mb-2 shrink-0">
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></div>
                <h1 class="text-xs font-black tracking-widest uppercase text-cyan-400 font-mono">Gboard 2030 // F1 Cockpit</h1>
            </div>
            <div class="flex items-center gap-3 text-xs font-mono text-slate-400">
                <span id="speed-telemetry" class="text-cyan-400 font-bold">300 KM/H</span>
                <span id="fps-counter" class="text-emerald-400">60 FPS</span>
            </div>
        </header>

        <!-- Dynamic Output Box (Virtual Display - Native Keyboard Disabled) -->
        <div class="relative flex-1 flex flex-col min-h-0">
            <div id="app-display" 
                class="w-full flex-1 glass-panel rounded-2xl p-4 text-lg font-normal text-slate-100 overflow-y-auto whitespace-pre-wrap break-words leading-relaxed"
                tabindex="-1">
                <span id="text-content"></span><span class="custom-cursor"></span>
            </div>
            
            <div class="absolute bottom-3 right-3 flex items-center gap-2">
                <button id="clear-text-btn" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-rose-900/40 text-slate-300 hover:text-rose-400 text-xs font-mono border border-slate-700/50 transition">
                    CLEAR
                </button>
                <button id="copy-text-btn" class="px-3 py-1.5 rounded-lg bg-cyan-950/60 hover:bg-cyan-900/80 text-cyan-400 text-xs font-mono border border-cyan-800/50 transition flex items-center gap-1">
                    <span>COPY</span>
                </button>
            </div>
        </div>
    </main>

    <!-- KEYBOARD CONTAINER -->
    <div id="keyboard-wrapper" class="relative w-full max-w-4xl mx-auto px-2 pb-2 z-20 transition-all duration-300 shrink-0">
        
        <canvas id="f1-canvas"></canvas>
        <canvas id="particle-canvas"></canvas>

        <div id="keyboard-container" class="relative glass-panel rounded-t-[2rem] rounded-b-2xl p-2 shadow-2xl transition-colors duration-300 flex flex-col justify-between" style="height: 46vh; max-height: 440px; min-height: 300px;">
            
            <!-- SUGGESTIONS BAR -->
            <div id="suggestion-bar" class="flex items-center justify-between px-2 py-1 mb-1 border-b border-white/5 text-sm font-medium h-8 gap-2 shrink-0">
                <div class="flex items-center gap-1 text-xs text-slate-400 font-mono pr-2 border-r border-white/10 shrink-0">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span id="current-lang-indicator">AZ</span>
                </div>
                <div class="flex-1 grid grid-cols-3 gap-2 text-center">
                    <button class="suggestion-chip truncate px-2 py-0.5 rounded-md hover:bg-white/10 text-slate-200 transition">salam</button>
                    <button class="suggestion-chip truncate px-2 py-0.5 rounded-md hover:bg-white/10 font-semibold text-cyan-300 transition">necəsiniz</button>
                    <button class="suggestion-chip truncate px-2 py-0.5 rounded-md hover:bg-white/10 text-slate-200 transition">yaxşı</button>
                </div>
                <div class="flex items-center gap-1 shrink-0 pl-1">
                    <button id="f1-toggle-btn" class="p-1 rounded-md bg-white/5 hover:bg-white/10 text-xs font-mono transition">
                        🏁 <span id="f1-status-text" class="text-[10px] text-cyan-400 font-bold">ON</span>
                    </button>
                </div>
            </div>

            <!-- TOOLBAR & THEMES -->
            <div class="flex items-center justify-between gap-1 mb-1 px-1 shrink-0">
                <div class="flex items-center gap-1 shrink-0">
                    <button id="google-search-btn" class="w-7 h-7 rounded-full bg-slate-800/80 border border-slate-700/60 flex items-center justify-center font-black text-cyan-400 text-xs shadow">G</button>
                    <button id="translator-btn" class="px-2 h-7 rounded-full bg-slate-800/80 border border-slate-700/60 flex items-center gap-1 font-medium text-xs text-slate-200 shadow">
                        <span>🌐</span> <span class="hidden sm:inline">Tərcümə</span>
                    </button>
                    <button id="sound-toggle-btn" class="w-7 h-7 rounded-full bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-xs shadow">🔊</button>
                </div>

                <div class="flex-1 overflow-x-auto no-scrollbar flex items-center gap-1.5 px-2 py-0.5">
                    <button data-theme="neon-blue" class="theme-chip shrink-0 px-2 py-0.5 rounded-full text-[10px] bg-cyan-950 text-cyan-400 border border-cyan-500/50">Neon Blue</button>
                    <button data-theme="cyber-pink" class="theme-chip shrink-0 px-2 py-0.5 rounded-full text-[10px] bg-pink-950 text-pink-400 border border-pink-500/30">Cyber Pink</button>
                    <button data-theme="fire-red" class="theme-chip shrink-0 px-2 py-0.5 rounded-full text-[10px] bg-red-950 text-red-400 border border-red-500/30">Fire Red</button>
                    <button data-theme="acid-green" class="theme-chip shrink-0 px-2 py-0.5 rounded-full text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-500/30">Acid Green</button>
                    <button data-theme="az-flag" class="theme-chip shrink-0 px-2 py-0.5 rounded-full text-[10px] bg-gradient-to-r from-blue-900 via-red-900 to-emerald-900 text-white border border-white/20">AZ Flag</button>
                </div>
            </div>

            <!-- KEYBOARD GRID -->
            <div id="keyboard-grid" class="flex-1 flex flex-col justify-between gap-1 select-none relative"></div>
        </div>

        <div id="accent-popup-container" class="accent-popup"></div>

        <!-- MINI WINDOWS -->
        <div id="google-window" class="hidden absolute top-2 left-1/2 -translate-x-1/2 glass-window rounded-xl border border-cyan-500/40 z-50 flex flex-col overflow-hidden shadow-2xl" style="width: 88%; height: 200px;">
            <div class="window-drag-handle bg-slate-900/90 px-3 py-1.5 flex items-center justify-between cursor-move border-b border-white/10">
                <span class="text-xs font-bold text-slate-200">Google Search Cockpit</span>
                <button class="window-close-btn p-1 text-slate-400">✕</button>
            </div>
            <div class="p-2 flex-1 flex flex-col gap-2 bg-slate-950/80">
                <form id="google-search-form" class="flex items-center gap-1.5">
                    <input id="google-search-input" type="text" placeholder="Search Google..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white" />
                    <button type="submit" class="px-2.5 py-1 bg-cyan-500 text-black font-bold text-xs rounded">Go</button>
                </form>
                <div id="google-results-container" class="flex-1 overflow-y-auto rounded bg-slate-900/50 p-2 text-xs text-slate-300"></div>
            </div>
            <div class="resize-handle"></div>
        </div>

        <div id="translator-window" class="hidden absolute top-2 left-1/2 -translate-x-1/2 glass-window rounded-xl border border-indigo-500/40 z-50 flex flex-col overflow-hidden shadow-2xl" style="width: 90%; height: 210px;">
            <div class="window-drag-handle bg-slate-900/90 px-3 py-1.5 flex items-center justify-between cursor-move border-b border-white/10">
                <span class="text-xs font-bold text-slate-200">Neural Instant Translator</span>
                <button class="window-close-btn p-1 text-slate-400">✕</button>
            </div>
            <div class="p-2 flex-1 flex flex-col justify-between gap-1.5 bg-slate-950/80">
                <div class="flex items-center justify-between text-xs">
                    <select id="trans-lang-pair" class="bg-slate-900 border border-slate-700 text-cyan-300 rounded px-1.5 py-0.5">
                        <option value="az|en">AZ ➔ EN</option>
                        <option value="en|az">EN ➔ AZ</option>
                        <option value="en|ru">EN ➔ RU</option>
                    </select>
                    <button id="exec-translate-btn" class="px-2.5 py-0.5 bg-indigo-600 text-white font-bold text-xs rounded">Translate</button>
                </div>
                <div class="grid grid-cols-2 gap-2 flex-1 min-h-0">
                    <textarea id="trans-source-text" class="bg-slate-900 border border-slate-800 rounded p-1 text-xs text-slate-200 resize-none" placeholder="Source text..."></textarea>
                    <div id="trans-target-text" class="bg-slate-900/40 border border-slate-800 rounded p-1 text-xs text-emerald-300 overflow-y-auto"></div>
                </div>
                <div class="flex items-center justify-end gap-1.5">
                    <button id="trans-copy-btn" class="px-2 py-0.5 bg-slate-800 text-slate-200 text-xs rounded">Copy</button>
                    <button id="trans-replace-btn" class="px-2 py-0.5 bg-cyan-600 text-black font-bold text-xs rounded">Replace</button>
                </div>
            </div>
            <div class="resize-handle"></div>
        </div>
    </div>

    <script>
        const state = {
            currentLang: 'AZ',
            layoutMode: 'alpha',
            isShifted: false,
            isCapsLocked: false,
            f1Enabled: true,
            soundEnabled: true,
            theme: 'neon-blue',
            nitroEndTime: 0,
            textBuffer: '',
            cursorPos: 0
        };

        const THEMES = {
            'neon-blue': { accent: '#00f0ff', glowRgb: '0, 240, 255', keyBg: 'rgba(0, 240, 255, 0.08)', keyText: '#e2e8f0', cars: ['#00f0ff', '#ff007f', '#00ff88'] },
            'cyber-pink': { accent: '#ff007f', glowRgb: '255, 0, 127', keyBg: 'rgba(255, 0, 127, 0.08)', keyText: '#fce7f3', cars: ['#ff007f', '#00f0ff', '#ffb700'] },
            'fire-red': { accent: '#ff3300', glowRgb: '255, 51, 0', keyBg: 'rgba(255, 51, 0, 0.1)', keyText: '#fee2e2', cars: ['#ff3300', '#ffcc00', '#ff0055'] },
            'acid-green': { accent: '#00ff66', glowRgb: '0, 255, 102', keyBg: 'rgba(0, 255, 102, 0.08)', keyText: '#dcfce7', cars: ['#00ff66', '#00ffff', '#ccff00'] },
            'az-flag': { accent: '#e11d48', glowRgb: '225, 29, 72', keyBg: 'rgba(14, 165, 233, 0.12)', keyText: '#ffffff', cars: ['#00a8ff', '#e11d48', '#00b894'] }
        };

        const LAYOUTS = {
            AZ: [
                ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', 'ö', 'ü'],
                ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ı', 'ə'],
                ['shift', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'ş', 'ç', 'ğ', 'backspace'],
                ['123', 'globe', 'space', '.', 'enter']
            ],
            EN: [
                ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
                ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
                ['shift', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'backspace'],
                ['123', 'globe', 'space', '.', 'enter']
            ],
            NUMBERS: [
                ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
                ['@', '#', '$', '_', '&', '-', '+', '(', ')', '/'],
                ['ABC', '*', '"', '\'', ':', ';', '!', '?', 'backspace'],
                ['ABC', 'globe', 'space', ',', 'enter']
            ]
        };

        const ACCENT_MAP = {
            'a': ['a', 'ə'], 'e': ['e', 'ə'], 'o': ['o', 'ö'], 'u': ['u', 'ü'], 'i': ['i', 'ı'], 's': ['s', 'ş'], 'c': ['c', 'ç'], 'g': ['g', 'ğ']
        };

        const textContentEl = document.getElementById('text-content');
        const keyboardGridEl = document.getElementById('keyboard-grid');
        const accentPopupEl = document.getElementById('accent-popup-container');
        const currentLangEl = document.getElementById('current-lang-indicator');
        const f1Canvas = document.getElementById('f1-canvas');
        const f1Ctx = f1Canvas.getContext('2d');
        const particleCanvas = document.getElementById('particle-canvas');
        const particleCtx = particleCanvas.getContext('2d');

        function updateDisplay() {
            textContentEl.textContent = state.textBuffer;
        }

        let audioCtx = null;
        function playClickSound() {
            if (!state.soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.035);
            } catch(e){}
        }

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(10);
        }

        // F1 ENGINE
        let f1Cars = [], lightTrails = [];
        function resizeCanvases() {
            const kbWrapper = document.getElementById('keyboard-wrapper');
            const rect = kbWrapper.getBoundingClientRect();
            f1Canvas.width = rect.width + 24;
            f1Canvas.height = rect.height + 24;
            particleCanvas.width = rect.width;
            particleCanvas.height = rect.height;
            initF1Cars();
        }

        function initF1Cars() {
            const w = f1Canvas.width, h = f1Canvas.height, perimeter = 2 * (w + h);
            const activeTheme = THEMES[state.theme] || THEMES['neon-blue'];
            f1Cars = [
                { progress: 0, speed: 3.5, color: activeTheme.cars[0], size: 5 },
                { progress: perimeter * 0.33, speed: 3.8, color: activeTheme.cars[1], size: 5 },
                { progress: perimeter * 0.66, speed: 3.2, color: activeTheme.cars[2], size: 5 }
            ];
        }

        function getPerimeterPos(dist, w, h) {
            const total = 2 * (w + h);
            dist = (dist % total + total) % total;
            if (dist < w) return { x: dist, y: 0 };
            else if (dist < w + h) return { x: w, y: dist - w };
            else if (dist < 2 * w + h) return { x: w - (dist - (w + h)), y: h };
            else return { x: 0, y: h - (dist - (2 * w + h)) };
        }

        function renderF1Loop() {
            const w = f1Canvas.width, h = f1Canvas.height;
            f1Ctx.fillStyle = 'rgba(10, 13, 20, 0.25)';
            f1Ctx.fillRect(0, 0, w, h);

            if (state.f1Enabled && w > 0) {
                const isNitro = Date.now() < state.nitroEndTime;
                f1Cars.forEach(car => {
                    car.progress += car.speed * (isNitro ? 2.8 : 1.0);
                    const pos = getPerimeterPos(car.progress, w, h);
                    lightTrails.push({ x: pos.x, y: pos.y, color: car.color, alpha: 1.0, radius: car.size });

                    f1Ctx.beginPath();
                    f1Ctx.arc(pos.x, pos.y, car.size, 0, Math.PI * 2);
                    f1Ctx.fillStyle = '#ffffff';
                    f1Ctx.fill();
                });

                for (let i = lightTrails.length - 1; i >= 0; i--) {
                    const t = lightTrails[i];
                    f1Ctx.beginPath();
                    f1Ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    f1Ctx.fillStyle = t.color;
                    f1Ctx.globalAlpha = t.alpha;
                    f1Ctx.fill();
                    t.alpha -= 0.05;
                    if (t.alpha <= 0) lightTrails.splice(i, 1);
                }
                f1Ctx.globalAlpha = 1.0;
            }
            requestAnimationFrame(renderF1Loop);
        }

        // RENDER KEYBOARD
        function renderKeyboard() {
            keyboardGridEl.innerHTML = '';
            let currentLayout = LAYOUTS[state.currentLang] || LAYOUTS.AZ;
            if (state.layoutMode === 'symbol') currentLayout = LAYOUTS.NUMBERS;

            currentLangEl.textContent = state.currentLang;

            currentLayout.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'flex items-center justify-center gap-1 w-full flex-1 my-0.5';

                row.forEach(key => {
                    const keyEl = document.createElement('button');
                    keyEl.className = 'keyboard-key flex-1 h-full select-none';
                    let displayChar = (state.isShifted || state.isCapsLocked) ? key.toUpperCase() : key.toLowerCase();

                    if (key === 'shift') {
                        keyEl.classList.add('special-key', 'w-[13%]');
                        keyEl.textContent = state.isCapsLocked ? '⇪' : (state.isShifted ? '▲' : '⇧');
                    } else if (key === 'backspace') {
                        keyEl.classList.add('special-key', 'w-[13%]');
                        keyEl.textContent = '⌫';
                    } else if (key === '123' || key === 'ABC') {
                        keyEl.classList.add('special-key', 'w-[12%]');
                        keyEl.textContent = key === '123' ? '?123' : 'ABC';
                    } else if (key === 'globe') {
                        keyEl.classList.add('special-key');
                        keyEl.textContent = '🌐';
                    } else if (key === 'space') {
                        keyEl.classList.add('w-[40%]');
                        keyEl.textContent = state.currentLang;
                    } else if (key === 'enter') {
                        keyEl.classList.add('action-key', 'w-[18%]');
                        keyEl.textContent = '↵';
                    } else {
                        keyEl.textContent = displayChar;
                    }

                    attachKeyEvents(keyEl, key);
                    rowEl.appendChild(keyEl);
                });
                keyboardGridEl.appendChild(rowEl);
            });
        }

        function attachKeyEvents(keyEl, keyVal) {
            let timer = null;
            const start = (e) => {
                e.preventDefault();
                triggerHaptic();
                playClickSound();
                state.nitroEndTime = Date.now() + 300;
                keyEl.classList.add('key-pressed');

                if (ACCENT_MAP[keyVal.toLowerCase()] && state.layoutMode === 'alpha') {
                    timer = setTimeout(() => showAccentPopup(keyEl, ACCENT_MAP[keyVal.toLowerCase()]), 300);
                }
            };

            const end = (e) => {
                clearTimeout(timer);
                keyEl.classList.remove('key-pressed');
                if (!accentPopupEl.classList.contains('active')) processKeyInput(keyVal);
            };

            keyEl.addEventListener('touchstart', start, { passive: false });
            keyEl.addEventListener('touchend', end);
            keyEl.addEventListener('mousedown', start);
            keyEl.addEventListener('mouseup', end);
        }

        function showAccentPopup(keyEl, accents) {
            accentPopupEl.innerHTML = '';
            accents.forEach(acc => {
                const opt = document.createElement('div');
                opt.className = 'accent-option';
                opt.textContent = state.isShifted ? acc.toUpperCase() : acc;
                opt.onclick = () => {
                    insertText(opt.textContent);
                    accentPopupEl.classList.remove('active');
                };
                accentPopupEl.appendChild(opt);
            });
            const rect = keyEl.getBoundingClientRect();
            const kbWrapper = document.getElementById('keyboard-wrapper').getBoundingClientRect();
            accentPopupEl.style.left = `${rect.left - kbWrapper.left + rect.width / 2}px`;
            accentPopupEl.classList.add('active');
        }

        function insertText(text) {
            state.textBuffer += text;
            updateDisplay();
            if (state.isShifted && !state.isCapsLocked) {
                state.isShifted = false;
                renderKeyboard();
            }
        }

        function processKeyInput(key) {
            if (key === 'shift') {
                state.isShifted = !state.isShifted;
                renderKeyboard();
            } else if (key === 'backspace') {
                state.textBuffer = state.textBuffer.slice(0, -1);
                updateDisplay();
            } else if (key === 'space') {
                insertText(' ');
            } else if (key === 'enter') {
                insertText('\n');
            } else if (key === '123') {
                state.layoutMode = 'symbol';
                renderKeyboard();
            } else if (key === 'ABC') {
                state.layoutMode = 'alpha';
                renderKeyboard();
            } else if (key === 'globe') {
                state.currentLang = state.currentLang === 'AZ' ? 'EN' : 'AZ';
                renderKeyboard();
            } else {
                let char = (state.isShifted || state.isCapsLocked) ? key.toUpperCase() : key.toLowerCase();
                insertText(char);
            }
        }

        // THEMES
        function applyTheme(themeKey) {
            const theme = THEMES[themeKey] || THEMES['neon-blue'];
            state.theme = themeKey;
            document.documentElement.style.setProperty('--theme-accent', theme.accent);
            document.documentElement.style.setProperty('--key-bg', theme.keyBg);
            document.documentElement.style.setProperty('--key-text', theme.keyText);
            initF1Cars();
        }

        document.querySelectorAll('.theme-chip').forEach(chip => {
            chip.onclick = () => applyTheme(chip.getAttribute('data-theme'));
        });

        document.getElementById('clear-text-btn').onclick = () => {
            state.textBuffer = '';
            updateDisplay();
        };

        document.getElementById('copy-text-btn').onclick = () => {
            navigator.clipboard.writeText(state.textBuffer);
            triggerHaptic();
        };

        window.addEventListener('resize', resizeCanvases);
        window.addEventListener('DOMContentLoaded', () => {
            renderKeyboard();
            resizeCanvases();
            applyTheme('neon-blue');
            requestAnimationFrame(renderF1Loop);
        });
    </script>
</body>
</html>
