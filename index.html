<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAM & Social Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --border-color: #262626;
            --text-main: #f5f5f5;
            --text-muted: #a8a8a8;
            --accent-color: #0095f6;
            --like-color: #ff3040;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
        }

        /* Naviqasiya Paneli */
        .sidebar {
            width: 245px;
            padding: 24px 12px;
            border-right: 1px solid var(--border-color);
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            padding: 0 12px 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        .brand-logo span {
            color: var(--accent-color);
            font-size: 30px;
            font-weight: 900;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            color: var(--text-main);
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: background 0.2s;
        }

        .nav-item a:hover {
            background-color: #1a1a1a;
        }

        .nav-item i {
            font-size: 20px;
            width: 24px;
        }

        /* Əsas Lent (Feed) */
        .main-content {
            margin-left: 245px;
            width: 100%;
            max-width: 630px;
            padding: 20px;
        }

        /* Hekayələr (Stories) */
        .stories-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 16px 0;
            margin-bottom: 24px;
            scrollbar-width: none;
        }

        .stories-container::-webkit-scrollbar {
            display: none;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-avatar-wrapper {
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-radius: 50%;
        }

        .story-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
            object-fit: cover;
        }

        .story-username {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 64px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Post Kartı */
        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-username {
            font-size: 14px;
            font-weight: 600;
        }

        .post-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            display: block;
        }

        .post-actions {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
        }

        .action-btns {
            display: flex;
            gap: 16px;
        }

        .action-btns i, .post-actions > i {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .action-btns i:hover, .post-actions > i:hover {
            opacity: 0.7;
        }

        .fa-heart.active {
            color: var(--like-color);
        }

        .fa-bookmark.active {
            color: var(--text-main);
        }

        .post-details {
            padding: 0 16px 16px;
        }

        .likes-count {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .caption {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .caption .username {
            font-weight: 600;
            margin-right: 6px;
        }

        .comments-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
        }

        .add-comment-box {
            display: flex;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            gap: 10px;
        }

        .add-comment-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            width: 100%;
            font-size: 14px;
        }

        .add-comment-box button {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
            }
            .sidebar .link-text, .brand-logo text {
                display: none;
            }
            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sol Naviqasiya Paneli -->
        <aside class="sidebar">
            <div>
                <div class="brand-logo">
                    <span>&</span> <div class="link-text">SHAM</div>
                </div>
                <ul class="nav-links">
                    <li class="nav-item"><a href="#"><i class="fa-solid fa-house"></i><span class="link-text">Ana Səhifə</span></a></li>
                    <li class="nav-item"><a href="#"><i class="fa-solid fa-magnifying-glass"></i><span class="link-text">Axtarış</span></a></li>
                    <li class="nav-item"><a href="#"><i class="fa-regular fa-compass"></i><span class="link-text">Kəşf Et</span></a></li>
                    <li class="nav-item"><a href="#"><i class="fa-regular fa-paper-plane"></i><span class="link-text">Mesajlar</span></a></li>
                    <li class="nav-item"><a href="#"><i class="fa-regular fa-heart"></i><span class="link-text">Bildirişlər</span></a></li>
                    <li class="nav-item"><a href="#"><i class="fa-regular fa-square-plus"></i><span class="link-text">Yarat</span></a></li>
                </ul>
            </div>
        </aside>

        <!-- Əsas Məzmun Lenti -->
        <main class="main-content">
            <!-- Hekayələr -->
            <div class="stories-container" id="stories-wrapper"></div>

            <!-- Postlar -->
            <div id="feed-posts"></div>
        </main>
    </div>

    <script>
        const usernames = ["sham_user", "alex_dev", "creative_mind", "urban_lens", "tech_insider", "nature_art", "digital_flow", "photo_studio", "code_life", "vibe_master"];
        const captions = [
            "SHAM platformasında ilk paylaşım! 🔥 #sham #social",
            "Sakitlik və ilham dolu bir gün ✨",
            "Möhtəşəm mənzərə və yeni ideyalar 🚀",
            "Dizayn və kodun mükəmməl uyğunluğu 💻",
            "Təbiətin ritmini hiss et 🌱 #nature"
        ];

        // Hekayələrin Yaradılması
        function generateStories() {
            const wrapper = document.getElementById('stories-wrapper');
            let storiesHTML = '';
            
            for(let i = 1; i <= 12; i++) {
                const user = usernames[i % usernames.length] + "_" + i;
                const avatarUrl = `https://picsum.photos/seed/sham_story_${i}/150/150`;
                
                storiesHTML += `
                    <div class="story-item">
                        <div class="story-avatar-wrapper">
                            <img src="${avatarUrl}" class="story-avatar" alt="${user}">
                        </div>
                        <span class="story-username">${user}</span>
                    </div>
                `;
            }
            wrapper.innerHTML = storiesHTML;
        }

        // Post Elementinin Hazırlanması
        function createPostElement(id) {
            const username = usernames[Math.floor(Math.random() * usernames.length)] + "_" + (id % 50);
            const userAvatar = `https://picsum.photos/seed/sham_avatar_${id}/100/100`;
            const postImg = `https://picsum.photos/seed/sham_post_${id}/600/600`;
            const likes = Math.floor(Math.random() * 950) + 20;
            const caption = captions[Math.floor(Math.random() * captions.length)];

            return `
                <article class="post-card" id="post-${id}">
                    <div class="post-header">
                        <div class="post-user-info">
                            <img src="${userAvatar}" class="post-avatar" alt="${username}">
                            <span class="post-username">${username}</span>
                        </div>
                        <i class="fa-solid fa-ellipsis"></i>
                    </div>
                    <img src="${postImg}" class="post-image" alt="Post">
                    <div class="post-actions">
                        <div class="action-btns">
                            <i class="fa-regular fa-heart" onclick="toggleLike(this, ${id})"></i>
                            <i class="fa-regular fa-comment"></i>
                            <i class="fa-regular fa-paper-plane"></i>
                        </div>
                        <i class="fa-regular fa-bookmark" onclick="toggleBookmark(this)"></i>
                    </div>
                    <div class="post-details">
                        <div class="likes-count" id="likes-${id}">${likes} bəyənmə</div>
                        <div class="caption">
                            <span class="username">${username}</span> ${caption}
                        </div>
                        <div class="comments-section" id="comments-${id}"></div>
                    </div>
                    <div class="add-comment-box">
                        <input type="text" placeholder="Şərh əlavə et..." id="input-${id}">
                        <button onclick="addComment(${id})">Paylaş</button>
                    </div>
                </article>
            `;
        }

        // Bəyənmə Funksiyası
        function toggleLike(element, postId) {
            const likesElem = document.getElementById(`likes-${postId}`);
            let currentLikes = parseInt(likesElem.innerText);

            if(element.classList.contains('fa-regular')) {
                element.classList.remove('fa-regular');
                element.classList.add('fa-solid', 'active');
                likesElem.innerText = `${currentLikes + 1} bəyənmə`;
            } else {
                element.classList.remove('fa-solid', 'active');
                element.classList.add('fa-regular');
                likesElem.innerText = `${currentLikes - 1} bəyənmə`;
            }
        }

        // Saxlama (Bookmark) Funksiyası
        function toggleBookmark(element) {
            if(element.classList.contains('fa-regular')) {
                element.classList.remove('fa-regular');
                element.classList.add('fa-solid', 'active');
            } else {
                element.classList.remove('fa-solid', 'active');
                element.classList.add('fa-regular');
            }
        }

        // Şərh Əlavə Etmək
        function addComment(postId) {
            const input = document.getElementById(`input-${postId}`);
            const commentsContainer = document.getElementById(`comments-${postId}`);
            
            if(input.value.trim() !== "") {
                const commentDiv = document.createElement('div');
                commentDiv.style.marginTop = "4px";
                commentDiv.innerHTML = `<strong>siz:</strong> ${input.value}`;
                commentsContainer.appendChild(commentDiv);
                input.value = "";
            }
        }

        // Dinamik Post Yükləmə (Infinite Scroll)
        let postCounter = 1;
        function loadMorePosts(count = 5) {
            const feed = document.getElementById('feed-posts');
            for(let i = 0; i < count; i++) {
                feed.innerHTML += createPostElement(postCounter);
                postCounter++;
            }
        }

        window.onload = () => {
            generateStories();
            loadMorePosts(8);
        };

        window.onscroll = () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 400) {
                loadMorePosts(3);
            }
        };
    </script>
</body>
</html>
