<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonim.az - WhatsApp Dizayn</title>
<style>
*{font-family: 'Segoe UI', sans-serif;}
body{margin:0;background:#111b21;color:white}
.header{background:#202c33;padding:15px;display:flex;justify-content:space-between}
.header h3{margin:0}
.chat-list{background:#111b21;height:100vh}
.contact{display:flex;padding:12px;border-bottom:1px solid #222;cursor:pointer}
.contact:hover{background:#202c33}
.avatar{width:45px;height:45px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;margin-right:12px}
.name{font-weight:500}
.last{color:#8696a0;font-size:13px}
.chat-window{display:none;flex-direction:column;height:100vh;background:#0b141a}
.messages{flex:1;padding:15px;overflow:auto}
.bubble{background:#202c33;padding:8px 12px;border-radius:8px;margin:8px 0;max-width:70%}
.me{background:#005c4b;margin-left:auto}
.input-area{display:flex;padding:10px;background:#202c33}
.input-area input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:white}
.input-area button{background:#25D366;border:none;border-radius:50%;width:45px;height:45px;margin-left:8px;color:white;font-size:20px}
.ad-top{background:#182229;text-align:center;padding:8px;color:#8696a0;font-size:12px;border-bottom:1px solid #222}
</style>
</head>
<body>

<div id="listPage">
<div class="header"><h3>Anonim.az</h3><span>👻</span></div>
<div class="ad-top">REKLAM - Hər klik sənə pul qazandırır</div>
<div class="chat-list" id="contacts"></div>
</div>

<div id="chatPage" class="chat-window">
<div class="header">
<button onclick="back()" style="background:none;border:none;color:white;font-size:20px">←</button>
<div id="chatName" style="margin-left:10px"></div>
</div>
<div class="ad-top">Anonim mesajlar bu pəncərədə gizli qalır</div>
<div class="messages" id="msgs"></div>
<div class="input-area">
<input id="msgInput" placeholder="Anonim mesaj yaz... Ə, Ş, Ç, Ö, Ü dəstəklənir">
<button onclick="send()">➤</button>
</div>
</div>

<script>
// Azərbaycan kontaktları
let contacts = [
{name:"Elvin Əliyev", last:"Sənə anonim mesaj gəldi...", letter:"E"},
{name:"Şəbnəm Quliyeva", last:"Gizli pərəstişkarın var 👻", letter:"Ş"},
{name:"Çingiz Öztürk", last:"Bu gün çox gözəl görünürsən", letter:"Ç"},
{name:"Aysel Məmmədova", last:"Səni bəyənən biri var", letter:"A"},
{name:"Ülvi Hüseynov", last:"Anonim etirafın var", letter:"Ü"}
];

let current = null;
let store = JSON.parse(localStorage.getItem('anon_chats')||'{}');

function renderContacts(){
 document.getElementById('contacts').innerHTML = contacts.map((c,i)=>`
  <div class="contact" onclick="openChat(${i})">
   <div class="avatar">${c.letter}</div>
   <div><div class="name">${c.name}</div><div class="last">${c.last}</div></div>
  </div>`).join('');
}

function openChat(i){
 current = contacts[i].name;
 document.getElementById('listPage').style.display='none';
 document.getElementById('chatPage').style.display='flex';
 document.getElementById('chatName').innerText=current + ' (Anonim)';
 renderMsgs();
}

function back(){
 document.getElementById('chatPage').style.display='none';
 document.getElementById('listPage').style.display='block';
 current=null;
}

function renderMsgs(){
 let m = store[current] || [];
 document.getElementById('msgs').innerHTML = m.map(x=>`<div class="bubble ${x.me?'me':''}">${x.text}</div>`).join('');
}

function send(){
 let txt = document.getElementById('msgInput').value.trim();
 if(!txt) return;
 // Reklam simulyasiyası
 alert('Reklam izləndi ✓ 0.10 AZN qazandın - Mesaj anonim getdi!');
 if(!store[current]) store[current]=[];
 store[current].push({text:txt, me:true});
 localStorage.setItem('anon_chats', JSON.stringify(store));
 document.getElementById('msgInput').value='';
 renderMsgs();
 // Cavab simulyasiyası
 setTimeout(()=>{
   if(!store[current]) store[current]=[];
   store[current].push({text:'Mesajın anonim çatdı, təşəkkürlər! 👻', me:false});
   localStorage.setItem('anon_chats', JSON.stringify(store));
   renderMsgs();
 },1000);
}

renderContacts();
</script>
</body>
</html>
