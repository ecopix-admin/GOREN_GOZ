<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Style 3D Battle Royale</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-color; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        
        /* UI Overlay */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: rgba(0, 255, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #000;
        }

        .stats-panel {
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            width: fit-content;
            border: 1px solid #444;
        }

        .hp-bar-container {
            width: 200px; height: 20px;
            background: #444;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #fff;
        }

        .hp-bar {
            width: 100%; height: 100%;
            background: #ff3333;
            transition: width 0.2s;
        }

        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 22px;
            background: #ff9900;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }

        #start-btn:hover { background: #ffaa22; transform: scale(1.05); }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="font-size: 48px; color: #ff9900; margin-bottom: 10px;">BATTLE ROYALE 3D</h1>
        <p style="font-size: 18px; color: #ccc;">WASD - Hərəkət | MOUSE - Baxış və Atəş (LMB)</p>
        <button id="start-btn" onclick="startGame()">OYUNA BAŞLA</button>
    </div>

    <div id="hud">
        <div class="stats-panel">
            <div>Düşmənlər: <span id="enemies-left" style="color: #ff3333;">5</span></div>
            <div>Kills: <span id="kills" style="color: #00ff88;">0</span></div>
            <div>
                HP: 
                <div class="hp-bar-container">
                    <div id="hp-bar" class="hp-bar"></div>
                </div>
            </div>
        </div>
        <div class="crosshair"></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        let playerHp = 100;
        let kills = 0;
        let enemies = [];
        let bullets = [];
        let zoneMesh;
        let zoneRadius = 150;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2;

            // İşıqlandırma
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 100, 50);
            scene.add(dirLight);

            // Torpaq (Xəritə)
            const floorGeo = new THREE.PlaneGeometry(400, 400);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x557a2b });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Binalar / Sığınacaqlar
            createMapObjects();

            // Qırmızı Daralan Zona (PUBG Safe Zone)
            const zoneGeo = new THREE.CylinderGeometry(zoneRadius, zoneRadius, 50, 32, 1, true);
            const zoneMat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true, side: THREE.DoubleSide });
            zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
            zoneMesh.position.y = 25;
            scene.add(zoneMesh);

            // Düşmən Botlar
            spawnEnemies(5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', shootBullet);
        }

        function createMapObjects() {
            const boxGeo = new THREE.BoxGeometry(10, 15, 10);
            const boxMat = new THREE.MeshLambertMaterial({ color: 0x777777 });

            for (let i = 0; i < 25; i++) {
                const building = new THREE.Mesh(boxGeo, boxMat);
                building.position.x = (Math.random() - 0.5) * 250;
                building.position.z = (Math.random() - 0.5) * 250;
                building.position.y = 7.5;
                scene.add(building);
            }
        }

        function spawnEnemies(count) {
            const enemyGeo = new THREE.BoxGeometry(1.5, 3, 1.5);
            const enemyMat = new THREE.MeshLambertMaterial({ color: 0xff1111 });

            for (let i = 0; i < count; i++) {
                const enemy = new THREE.Mesh(enemyGeo, enemyMat);
                enemy.position.x = (Math.random() - 0.5) * 200;
                enemy.position.z = (Math.random() - 0.5) * 200;
                enemy.position.y = 1.5;
                enemy.hp = 50;
                scene.add(enemy);
                enemies.push(enemy);
            }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.body.requestPointerLock();
            initScene();
            animate();
        }

        // Siçan İdarəsi (Look Around)
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.002;
            }
        });

        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function shootBullet() {
            if (document.pointerLockElement !== document.body) return;

            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.copy(camera.position);
            bullet.ray = new THREE.Vector3();
            camera.getWorldDirection(bullet.ray);

            scene.add(bullet);
            bullets.push(bullet);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // Hərəkət Fizikası
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y = 2; // Yerdə saxlamaq

            // Güllələrin hərəkəti
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.addScaledVector(b.ray, 3);

                // Düşmənə dəymə yoxlanışı
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (b.position.distanceTo(e.position) < 2) {
                        e.hp -= 25;
                        scene.remove(b);
                        bullets.splice(i, 1);

                        if (e.hp <= 0) {
                            scene.remove(e);
                            enemies.splice(j, 1);
                            kills++;
                            document.getElementById('kills').innerText = kills;
                            document.getElementById('enemies-left').innerText = enemies.length;

                            if (enemies.length === 0) {
                                alert("VICTORY ROYALE! QALİB OLDUĞUNUZ!");
                                location.reload();
                            }
                        }
                        break;
                    }
                }
            }

            // Qırmızı Zona Daralması
            if (zoneRadius > 10) {
                zoneRadius -= 0.03;
                zoneMesh.scale.set(zoneRadius / 150, 1, zoneRadius / 150);
            }

            // Zonadan kənarda qalan oyunçunun canı getsin
            const distFromCenter = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
            if (distFromCenter > zoneRadius) {
                playerHp -= 0.1;
                document.getElementById('hp-bar').style.width = playerHp + '%';
                if (playerHp <= 0) {
                    alert("GAME OVER! Zona sizi məhv etdi.");
                    location.reload();
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
