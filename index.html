<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sham-Cell | Ultra Military Shield</title>
    <style>
        body {
            background-color: #000;
            color: #00ffaa;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .shield-container {
            border: 2px solid #00ffaa;
            padding: 40px 30px;
            border-radius: 25px;
            background: radial-gradient(circle, #051a10 0%, #000000 100%);
            box-shadow: 0 0 40px rgba(0, 255, 170, 0.2);
            width: 85%;
            max-width: 420px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin: 0 0 5px 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
        }

        .version {
            font-size: 0.7rem;
            color: #00ffaa;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .radar-box {
            width: 120px;
            height: 120px;
            border: 2px dashed #00ffaa;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .radar-line {
            width: 50%;
            height: 2px;
            background: #00ffaa;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: left center;
            display: none;
        }

        @keyframes rotateRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .telemetry {
            background: #080808;
            border: 1px solid #111;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 0.85rem;
            text-align: left;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: #888;
        }

        .telemetry-value { color: #fff; font-weight: bold; }

        button {
            background: #00ffaa;
            color: #000;
            border: none;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button.active {
            background: #ff2244;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 34, 68, 0.5);
        }

        .footer-text {
            font-size: 0.65rem;
            color: #444;
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="shield-container">
    <h1>SHAM-CELL SYSTEM</h1>
    <div class="version">ULTRA MILITARY DEFENSE v3.0</div>
    
    <div class="radar-box" id="radar">
        <div class="radar-line" id="radarLine"></div>
        <span id="shieldStatus" style="font-size: 0.8rem; font-weight: bold; color: #888;">STANDBY</span>
    </div>

    <div class="telemetry">
        <div class="telemetry-row">
            <span>Mühərrik 1 (Yarasa):</span>
            <span class="telemetry-value" id="m1Freq">0 Hz</span>
        </div>
        <div class="telemetry-row">
            <span>Mühərrik 2 (Baryer):</span>
            <span class="telemetry-value" id="m2Freq">0 Hz</span>
        </div>
        <div class="telemetry-row">
            <span>Müdafiə Rejimi:</span>
            <span class="telemetry-value" id="shieldMode" style="color: #00ffaa;">OFF</span>
        </div>
    </div>
    
    <button id="triggerBtn">Müdafiəni Blokla</button>
    
    <div class="footer-text">
        Cüt Fazalı Audio Alqoritmi. Arxa fonda işləmə və ekran kilidi qorunması tam aktivdir.
    </div>
</div>

<script>
    let audioCtx;
    let osc1, osc2;
    let gain1, gain2;
    let isRunning = false;
    let militaryEngineInterval;
    let wakeLock = null;

    const triggerBtn = document.getElementById('triggerBtn');
    const shieldStatus = document.getElementById('shieldStatus');
    const shieldMode = document.getElementById('shieldMode');
    const m1Freq = document.getElementById('m1Freq');
    const m2Freq = document.getElementById('m2Freq');
    const radarLine = document.getElementById('radarLine');

    async function activateWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) { console.log("WakeLock Xətası:", err.message); }
    }

    function runMilitaryEngine() {
        let sweepFreq = 16000;
        let step = 250;

        militaryEngineInterval = setInterval(() => {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            // 1. MÜHƏRRİK: Yarasa Radarı (Davamlı xaotik sıçrayışlar)
            sweepFreq += step;
            if (sweepFreq >= 22000 || sweepFreq <= 16000) step = -step;
            
            // Təsadüfi kiçik tezlik sürüşmələri əlavə edirik (Ağcaqanadın yaddaşını tam iflic etmək üçün)
            let jitter = Math.floor(Math.random() * 150) - 75;
            let finalM1 = sweepFreq + jitter;
            
            osc1.frequency.setValueAtTime(finalM1, now);
            m1Freq.innerText = finalM1 + " Hz";

            // Aqressiv yarasa çıqqıltı impulsu
            gain1.gain.setValueAtTime(0.01, now);
            gain1.gain.exponentialRampToValueAtTime(0.8, now + 0.01);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            // 2. MÜHƏRRİK: Sabit Baryer (İnsanın ətrafını qoruyan divar)
            // 19.5 kHz - bunu insan əsla eşitmir, amma həşəratın naviqasiyasını tamamilə kor edir
            let finalM2 = 19500 + (jitter * 0.5);
            osc2.frequency.setValueAtTime(finalM2, now);
            m2Freq.innerText = Math.round(finalM2) + " Hz";
            
            // Sabit divar səs gücü (Mikroskopik dalğalanma ilə)
            gain2.gain.setValueAtTime(0.08, now);

        }, 180); // Daha sürətli impuls (180ms) - Sıfır Şans!
    }

    triggerBtn.onclick = async function() {
        if (!isRunning) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Mühərrik 1 Quraşdırılması
            osc1 = audioCtx.createOscillator();
            gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            
            // Mühərrik 2 Quraşdırılması
            osc2 = audioCtx.createOscillator();
            gain2 = audioCtx.createGain();
            osc2.type = 'triangle'; // Daha kəsici dalğa forması
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
            
            runMilitaryEngine();
            await activateWakeLock();

            // UI Aktivasiya
            this.innerText = "Müdafiəni Söndür";
            this.classList.add('active');
            shieldStatus.innerText = "SHIELD ON";
            shieldStatus.style.color = "#00ffaa";
            shieldMode.innerText = "MAXIMUM MILITARY";
            shieldMode.style.color = "#ff2244";
            radarLine.style.display = 'block';
            radarLine.style.animation = 'rotateRadar 2s linear infinite';
            
            isRunning = true;
        } else {
            clearInterval(militaryEngineInterval);
            if (osc1) osc1.stop();
            if (osc2) osc2.stop();
            if (audioCtx) audioCtx.close();
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }

            // UI Deaktivasiya
            this.innerText = "Müdafiəni Blokla";
            this.classList.remove('active');
            shieldStatus.innerText = "STANDBY";
            shieldStatus.style.color = "#888";
            shieldMode.innerText = "OFF";
            shieldMode.style.color = "#00ffaa";
            m1Freq.innerText = "0 Hz";
            m2Freq.innerText = "0 Hz";
            radarLine.style.display = 'none';
            radarLine.style.animation = 'none';
            
            isRunning = false;
        }
    };

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await activateWakeLock();
        }
    });
</script>

</body>
</html>
