<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LinguaKey — Multi-Lang Social Keyboard Engine</title>
<style>
:root {
    --bg: #090b10;
    --surface: #11151d;
    --border: #202631;
    --accent: #ff3b6b;
    --accent-glow: rgba(255, 59, 107, 0.3);
    --key-bg: #1a202c;
    --text: #f1f3f6;
    --muted: #7e8998;
    --success: #5de07e;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

body {
    background: #040507;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.app {
    width: 100%;
    max-width: 460px;
    height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    position: relative;
}

/* HEADER & BRANDING */
.header {
    height: 56px;
    padding: 0 14px;
    background: #0d1016;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.social-brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.social-logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #ff6688);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    box-shadow: 0 4px 12px var(--accent-glow);
}

.room-info {
    font-size: 11px;
    color: var(--muted);
}

.room-id {
    color: var(--success);
    font-weight: 700;
}

/* CHAT VIEWPORT */
.chat-box {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.msg {
    max-width: 82%;
    display: flex;
    flex-direction: column;
}

.msg.in { align-self: flex-start; }
.msg.out { align-self: flex-end; }

.bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
}

.msg.in .bubble {
    background: #171d27;
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
}

.msg.out .bubble {
    background: linear-gradient(135deg, var(--accent), #ff527b);
    border-bottom-right-radius: 4px;
}

.tr-text {
    font-size: 11px;
    margin-top: 4px;
    opacity: 0.85;
}

.msg.in .tr-text { color: var(--success); }
.msg.out .tr-text { text-align: right; }

/* TOOLBAR & INPUT */
.input-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px;
}

.input-row {
    display: flex;
    gap: 6px;
}

textarea {
    flex: 1;
    height: 42px;
    resize: none;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #090b10;
    color: #fff;
    padding: 10px;
    font-size: 14px;
    outline: none;
}

.btn-action {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--key-bg);
    color: #fff;
    cursor: pointer;
    font-size: 16px;
}

.btn-send {
    background: linear-gradient(135deg, var(--accent), #ff527b);
    border: none;
}

.link-bar {
    display: flex;
    gap: 6px;
    margin-top: 6px;
}

.btn-share-link {
    flex: 1;
    height: 32px;
    border-radius: 8px;
    background: rgba(255, 59, 107, 0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

/* KEYBOARD */
.keyboard {
    background: #07090d;
    padding: 6px 3px 10px;
    border-top: 1px solid var(--border);
}

.row {
    display: flex;
    gap: 3px;
    margin-bottom: 5px;
    justify-content: center;
}

.key {
    flex: 1;
    height: 40px;
    max-width: 42px;
    border: 0;
    border-radius: 6px;
    background: var(--key-bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 2px 0 #000;
}

.key:active { transform: translateY(2px); }

.key.sp {
    flex: 1.5;
    background: #111620;
}

.key.space { flex: 4; max-width: none; }

.key.tr-btn {
    background: linear-gradient(135deg, var(--accent), #ff527b);
    font-weight: 700;
    flex: 2;
}

/* TOAST */
.toast {
    position: absolute;
    top: 66px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #000;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 10;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="social-brand">
            <div class="social-logo">LK</div>
            <div>
                <div style="font-weight:800; font-size:14px;">LinguaSocial</div>
                <div class="room-info">Otaq: <span class="room-id" id="lblRoom">#LOBBY</span></div>
            </div>
        </div>
        <div style="font-size:11px; color:var(--success);">● ONLINE</div>
    </header>

    <div class="chat-box" id="chatBox">
        <div class="msg in">
            <div class="bubble">Salam! Bu çata xoş gəldiniz. Qarşı tərəfə dəvət linki ataraq real-vaxt tərcüməli yazışa bilərsiniz.</div>
            <div class="tr-text">🇬🇧 Welcome! Share the link to start live translation.</div>
        </div>
    </div>

    <div class="input-panel">
        <div class="input-row">
            <textarea id="txtInput" placeholder="Mesajı yazın..."></textarea>
            <button class="btn-action btn-send" id="btnSend">➤</button>
        </div>
        <div class="link-bar">
            <button class="btn-share-link" id="btnGenLink">🔗 Qarşı tərəf üçün Dəvət Linki Yarat</button>
        </div>
    </div>

    <!-- AZERBAIJANI KEYBOARD -->
    <div class="keyboard" id="keyboard">
        <div class="row">
            <button class="key">Q</button><button class="key">Ü</button><button class="key">E</button>
            <button class="key">R</button><button class="key">T</button><button class="key">Y</button>
            <button class="key">U</button><button class="key">İ</button><button class="key">O</button>
            <button class="key">P</button><button class="key">Ö</button><button class="key">Ğ</button>
        </div>
        <div class="row">
            <button class="key">A</button><button class="key">S</button><button class="key">D</button>
            <button class="key">F</button><button class="key">G</button><button class="key">H</button>
            <button class="key">J</button><button class="key">K</button><button class="key">L</button>
            <button class="key">I</button><button class="key">Ə</button>
        </div>
        <div class="row">
            <button class="key sp">⇧</button>
            <button class="key">Z</button><button class="key">X</button><button class="key">C</button>
            <button class="key">V</button><button class="key">B</button><button class="key">N</button>
            <button class="key">M</button><button class="key">Ç</button><button class="key">Ş</button>
            <button class="key sp" id="btnBack">⌫</button>
        </div>
        <div class="row">
            <button class="key sp">123</button>
            <button class="key space" id="btnSpace">space</button>
            <button class="key tr-btn" id="btnTranslate">TƏRCÜMƏ</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/**
 * LinguaKey Social Core Engine
 */
class LinguaSocialEngine {
    constructor() {
        this.roomId = this.getOrCreateRoom();
        this.input = document.getElementById('txtInput');
        this.chat = document.getElementById('chatBox');
        this.toast = document.getElementById('toast');
        
        document.getElementById('lblRoom').textContent = `#${this.roomId}`;
        this.initEvents();
    }

    getOrCreateRoom() {
        const params = new URLSearchParams(window.location.search);
        let room = params.get('room');
        if (!room) {
            room = Math.random().toString(36).substring(2, 8).toUpperCase();
        }
        return room;
    }

    initEvents() {
        // Keyboard Handling
        document.getElementById('keyboard').addEventListener('click', (e) => {
            const btn = e.target.closest('.key');
            if (!btn) return;
            const txt = btn.textContent.trim();

            if (txt === '⌫') {
                this.input.value = this.input.value.slice(0, -1);
            } else if (txt === 'space') {
                this.input.value += ' ';
            } else if (txt === 'TƏRCÜMƏ') {
                this.translateInput();
            } else if (txt !== '123' && txt !== '⇧') {
                this.input.value += txt;
            }
        });

        document.getElementById('btnSend').onclick = () => this.sendMessage();
        document.getElementById('btnGenLink').onclick = () => this.copyInviteLink();
    }

    async translateText(text, fromLang, toLang) {
        try {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`;
            const res = await fetch(url);
            const data = await res.json();
            return data.responseData ? data.responseData.translatedText : text;
        } catch {
            return text;
        }
    }

    async translateInput() {
        const val = this.input.value.trim();
        if (!val) return;
        this.showToast('Tərcümə olunur...');
        const tr = await this.translateText(val, 'az', 'en');
        this.input.value = tr;
    }

    async sendMessage() {
        const val = this.input.value.trim();
        if (!val) return;

        const tr = await this.translateText(val, 'az', 'en');

        const msgEl = document.createElement('div');
        msgEl.className = 'msg out';
        msgEl.innerHTML = `
            <div class="bubble">${this.escape(val)}</div>
            <div class="tr-text">🇬🇧 ${this.escape(tr)}</div>
        `;
        this.chat.appendChild(msgEl);
        this.input.value = '';
        this.chat.scrollTop = this.chat.scrollHeight;
    }

    copyInviteLink() {
        const link = `${window.location.origin}${window.location.pathname}?room=${this.roomId}`;
        navigator.clipboard.writeText(link);
        this.showToast('Link kopyalandı! WhatsApp-da qarşı tərəfə atın.');
    }

    showToast(msg) {
        this.toast.textContent = msg;
        this.toast.classList.add('show');
        setTimeout(() => this.toast.classList.remove('show'), 2500);
    }

    escape(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
}

document.addEventListener('DOMContentLoaded', () => new LinguaSocialEngine());
</script>
</body>
</html>
