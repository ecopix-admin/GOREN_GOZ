<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoPortal - HD Filmlər</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding-bottom: 50px; }
        
        header { background: #1e293b; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .logo { font-size: 22px; font-weight: bold; color: #38bdf8; text-decoration: none; }
        
        .search-box { display: flex; gap: 8px; }
        .search-box input { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .search-box button { padding: 8px 15px; border-radius: 6px; border: none; background: #0284c7; color: white; cursor: pointer; font-weight: bold; }

        .lang-select { padding: 8px; border-radius: 6px; background: #0f172a; color: white; border: 1px solid #334155; cursor: pointer; }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
        h2 { margin-bottom: 15px; border-left: 4px solid #0284c7; padding-left: 10px; font-size: 20px; }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .movie-card { background: #1e293b; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .movie-card:hover { transform: scale(1.03); }
        .movie-card img { width: 100%; height: 230px; object-fit: cover; background: #334155; }
        .movie-info { padding: 10px; }
        .movie-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-rating { font-size: 11px; color: #fbbf24; margin-top: 4px; }

        /* Modal Player */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; width: 95%; max-width: 850px; border-radius: 8px; overflow: hidden; position: relative; }
        .close-btn { position: absolute; top: 8px; right: 12px; color: white; font-size: 28px; cursor: pointer; z-index: 101; background: rgba(0,0,0,0.5); width: 35px; height: 35px; border-radius: 50%; text-align: center; line-height: 32px; }
        
        .player-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .ad-space { background: #f59e0b; color: #000; text-align: center; padding: 6px; font-weight: bold; font-size: 12px; }
        .server-btns { display: flex; gap: 10px; padding: 10px; background: #0f172a; justify-content: center; }
        .server-btn { background: #334155; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .server-btn:hover { background: #0284c7; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="loadPopular()">🎬 KinoPortal</a>
        
        <div class="search-box">
            <select id="langSelect" class="lang-select" onchange="loadPopular()">
                <option value="tr-TR">🇹🇷 Türkçe</option>
                <option value="ru-RU">🇷🇺 Русский</option>
            </select>
            <input type="text" id="searchInput" placeholder="Film adı yazın..." onkeypress="if(event.key === 'Enter') searchMovies()">
            <button onclick="searchMovies()">Axtar</button>
        </div>
    </header>

    <div class="container">
        <h2 id="sectionTitle">Populyar Filmlər</h2>
        <div class="movie-grid" id="movieGrid">Yüklənir...</div>
    </div>

    <!-- Modal Video Player -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <div class="ad-space">📢 REKLAM PANECİĞİ (4-5 Saniyəlik Reklam Kodunuz)</div>
            
            <div class="player-container">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>

            <div class="server-btns">
                <span style="font-size: 12px; align-self: center;">Serverlər:</span>
                <button class="server-btn" onclick="switchServer(1)">Server 1</button>
                <button class="server-btn" onclick="switchServer(2)">Server 2</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084dd2fb0648c';
        let currentMovieId = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadPopular();
        });

        function getLang() {
            return document.getElementById('langSelect').value;
        }

        async function loadPopular() {
            document.getElementById('sectionTitle').innerText = "Populyar Filmlər";
            const lang = getLang();
            const url = `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=${lang}&page=1`;
            fetchAndRender(url);
        }

        async function searchMovies() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;

            document.getElementById('sectionTitle').innerText = `Axtarış: "${query}"`;
            const lang = getLang();
            const url = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=${lang}&query=${encodeURIComponent(query)}`;
            fetchAndRender(url);
        }

        async function fetchAndRender(url) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<p style="grid-column: 1/-1;">Yüklənir, xahiş olunur gözləyin...</p>';
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if(!data.results || data.results.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1;">Heç bir film tapılmadı.</p>';
                    return;
                }
                
                renderGrid(data.results);
            } catch (err) {
                grid.innerHTML = '<p style="grid-column: 1/-1; color: #ef4444;">Məlumat çəkilərkən xəta baş verdi. İntrnet bağlantınızı yoxlayın.</p>';
            }
        }

        function renderGrid(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openPlayer(movie.id);

                const imgUrl = movie.poster_path 
                    ? `https://image.tmdb.org/t/p/w300${movie.poster_path}` 
                    : 'https://via.placeholder.com/300x450?text=Afişa+Yoxdur';

                card.innerHTML = `
                    <img src="${imgUrl}" alt="${movie.title}">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-rating">⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openPlayer(movieId) {
            currentMovieId = movieId;
            const modal = document.getElementById('playerModal');
            modal.style.display = 'flex';
            switchServer(1); // Susmaya görə 1-ci serveri açır
        }

        function switchServer(serverNum) {
            const iframe = document.getElementById('videoIframe');
            const lang = getLang();
            
            if (serverNum === 1) {
                iframe.src = `https://vidsrc.to/embed/movie/${currentMovieId}`;
            } else if (serverNum === 2) {
                iframe.src = `https://multiembed.mov/?video_id=${currentMovieId}&tmdb=1`;
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoIframe');
            iframe.src = '';
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
