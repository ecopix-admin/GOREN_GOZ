<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzSearch - Milli Axtarış Sistemi</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto;
            margin-bottom: auto;
        }

        /* Logo */
        .logo {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 20px;
            letter-spacing: -1px;
            text-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        .logo span {
            color: #f43f5e;
        }

        /* Axtarış Formu */
        .search-box {
            width: 100%;
            display: flex;
            background-color: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 30px;
            padding: 6px 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 1.1rem;
            padding: 10px 15px;
        }

        .search-box button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 20px;
            padding: 10px 24px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        /* Reklam Zonaları (Sizin Qazanc Yeriniz) */
        .ad-banner {
            width: 100%;
            max-width: 728px;
            background-color: #1e293b;
            border: 1px dashed var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        /* Tez-tez İstifadə Olunan Linklər */
        .quick-links {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.9rem;
            border: 1px solid #334155;
            transition: 0.2s;
        }

        .link-card:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Yuxarı Reklam Sahəsi -->
    <div class="ad-banner" style="margin-top: 10px;">
        📢 REKLAM KODUNUZU BURA YERLƏŞDİRİN (Adsterra / Google AdSense)
    </div>

    <div class="container">
        <!-- Şəxsi Logonuz -->
        <div class="logo">Az<span>Search</span></div>

        <!-- Axtarış Bölməsi -->
        <form class="search-box" action="https://www.google.com/search" method="GET" target="_blank">
            <input type="text" name="q" placeholder="İstədiyiniz hər şeyi axtarın..." required autocomplete="off">
            <button type="submit">Axtar</button>
        </form>

        <!-- Sürətli Keçid Düymələri -->
        <div class="quick-links">
            <a href="https://www.youtube.com" class="link-card" target="_blank">▶️ YouTube</a>
            <a href="https://www.instagram.com" class="link-card" target="_blank">📸 Instagram</a>
            <a href="https://www.wikipedia.org" class="link-card" target="_blank">📚 Wikipedia</a>
            <a href="https://web.telegram.org" class="link-card" target="_blank">✈️ Telegram</a>
        </div>
    </div>

    <!-- Alt Reklam Sahəsi -->
    <div class="ad-banner">
        📢 İKİNCİ REKLAM KODUNUZU BURA YERLƏŞDİRİN
    </div>

    <footer>
        &copy; 2026 AzSearch Engine. Bütün hüquqlar qorunur.
    </footer>

</body>
</html>
