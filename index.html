<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzSearch - Milli Axtarış Portal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --border-color: #232d3f;
            --accent-color: #3b82f6;
            --text-color: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Yuxarı Sabit Panel (Sizin Loqonuz və Axtarış) */
        .top-bar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
            white-space: nowrap;
            cursor: pointer;
        }

        .logo span {
            color: var(--accent-color);
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 600px;
        }

        .search-box {
            width: 100%;
            display: flex;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2px 4px;
        }

        .search-box:focus-within {
            border-color: var(--accent-color);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 0.95rem;
            padding: 8px 14px;
        }

        .search-box button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 6px 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Təkliflər Siyahısı */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-top: 4px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 1001;
        }

        .suggestion-item {
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #cbd5e1;
            border-bottom: 1px solid #1e293b;
        }

        .suggestion-item:hover {
            background-color: #1e293b;
            color: var(--accent-color);
        }

        /* Reklam Sahəsi */
        .ad-banner {
            background-color: #0f172a;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            padding: 6px;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* Axtarış Nəticələrinin Açıldığı Ərazi (Sizin Çərçivəniz) */
        .results-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Başlanğıc Ekranı Maskası */
        .welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .welcome-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Yuxarı Sabit Panel (Sizin Brendiniz) -->
    <div class="top-bar">
        <div class="logo" onclick="resetSearch()">Az<span>Search</span></div>

        <div class="search-wrapper">
            <form class="search-box" id="searchForm" onsubmit="executeSearch(event)">
                <input type="text" id="searchInput" placeholder="İstədiyiniz hər şeyi axtarın..." autocomplete="off" required>
                <button type="submit">Axtar</button>
            </form>

            <div class="suggestions-list" id="suggestions"></div>
        </div>
    </div>

    <!-- Reklam Zonası -->
    <div class="ad-banner">
        📢 REKLAM SAHƏSİ (Adsterra / AdSense Kodunuz)
    </div>

    <!-- Axtarış Nəticələri Ekrani -->
    <div class="results-container">
        <!-- İlk girişdə görünən ekran -->
        <div class="welcome-screen" id="welcomeScreen">
            <h1>Az<span>Search</span> Engine</h1>
            <p style="color: var(--text-muted);">Təhlükəsiz və Sürətli Axtarış Platforması</p>
        </div>

        <!-- Nəticələrin yükləndiyi pəncərə -->
        <iframe id="resultsFrame" src="about:blank"></iframe>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');
        const searchForm = document.getElementById('searchForm');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const resultsFrame = document.getElementById('resultsFrame');

        const MAX_HISTORY = 15;

        function getHistory() {
            return JSON.parse(localStorage.getItem('searchHistory') || '[]');
        }

        function saveToHistory(query) {
            if (!query) return;
            let history = getHistory();
            history = history.filter(item => item.toLowerCase() !== query.toLowerCase());
            history.unshift(query);
            if (history.length > MAX_HISTORY) history.pop();
            localStorage.setItem('searchHistory', JSON.stringify(history));
        }

        // Axtarış icra edildikdə nəticəni daxili pəncərədə açır
        function executeSearch(e) {
            if (e) e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            saveToHistory(query);
            suggestionsBox.style.display = 'none';
            welcomeScreen.style.display = 'none';

            // Google Axtarışı Sizin Çərçivədə (Məxfilik rejimində) Yükləyir
            // Nəticələr birbaşa daxili pəncərədə görünür, üst panel sizin loqonuz olaraq qalır
            const searchUrl = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
            resultsFrame.src = searchUrl;
        }

        function resetSearch() {
            welcomeScreen.style.display = 'flex';
            resultsFrame.src = 'about:blank';
            searchInput.value = '';
        }

        // Canlı Təkliflər (Autocomplete)
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query.length === 0) {
                showHistory();
                return;
            }

            const script = document.createElement('script');
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleSuggestions`;
            document.body.appendChild(script);
            document.body.removeChild(script);
        });

        window.handleSuggestions = function(data) {
            const results = data[1];
            suggestionsBox.innerHTML = '';

            if (results.length > 0) {
                results.slice(0, 7).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = item;
                    div.onclick = function() {
                        searchInput.value = item;
                        executeSearch();
                    };
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        };

        function showHistory() {
            const history = getHistory();
            suggestionsBox.innerHTML = '';

            if (history.length > 0) {
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = '🕒 ' + item;
                    div.onclick = function() {
                        searchInput.value = item;
                        executeSearch();
                    };
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        }

        searchInput.addEventListener('focus', function() {
            if (this.value.trim().length === 0) showHistory();
        });

        document.addEventListener('click', function(e) {
            if (!searchForm.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
