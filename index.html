<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoPortal - Onlayn Filmlər</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding-bottom: 50px; }
        
        header { background: #1e293b; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .logo { font-size: 24px; font-weight: bold; color: #38bdf8; text-decoration: none; }
        
        .search-box { display: flex; gap: 10px; }
        .search-box input { padding: 8px 15px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .search-box button { padding: 8px 15px; border-radius: 6px; border: none; background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
        .search-box button:hover { background: #0369a1; }

        .lang-select { padding: 8px; border-radius: 6px; background: #0f172a; color: white; border: 1px solid #334155; cursor: pointer; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        h2 { margin-bottom: 20px; border-left: 4px solid #0284c7; padding-left: 10px; }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .movie-card { background: #1e293b; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; }
        .movie-card:hover { transform: translateY(-5px); }
        .movie-card img { width: 100%; height: 260px; object-fit: cover; }
        .movie-info { padding: 12px; }
        .movie-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-rating { font-size: 12px; color: #fbbf24; margin-top: 5px; }

        /* Modal (Video Player) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; width: 90%; max-width: 800px; border-radius: 10px; overflow: hidden; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: white; font-size: 24px; cursor: pointer; z-index: 101; }
        .player-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* Ad Banner Overlay Simulation */
        .ad-banner { background: #f59e0b; color: #000; text-align: center; padding: 8px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">🎬 KinoPortal</a>
        
        <div class="search-box">
            <select id="langSelect" class="lang-select" onchange="changeLanguage()">
                <option value="tr-TR">🇹🇷 Türkçe</option>
                <option value="ru-RU">🇷🇺 Русский</option>
            </select>
            <input type="text" id="searchInput" placeholder="Film axtar...">
            <button onclick="searchMovies()">Axtar</button>
        </div>
    </header>

    <div class="container">
        <h2 id="sectionTitle">Populyar Filmlər</h2>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <div class="ad-banner">📢 REKLAM YERİ (Buraya 4-5 saniyəlik reklam kodunuzu yerləşdirə bilərsiniz)</div>
            <div class="player-container">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        // TMDB Demo API Key
        const API_KEY = '3fd2be6f0c70a2a598f084dd2fb0648c'; 
        let currentLang = 'tr-TR';

        // Səhifə yüklənəndə populyar filmləri gətir
        document.addEventListener('DOMContentLoaded', () => {
            fetchMovies(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=${currentLang}`);
        });

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            fetchMovies(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=${currentLang}`);
        }

        async function fetchMovies(url) {
            const res = await fetch(url);
            const data = await res.json();
            displayMovies(data.results);
        }

        function displayMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            movies.forEach(movie => {
                if(!movie.poster_path) return;
                
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openPlayer(movie.id);

                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-rating">⭐ ${movie.vote_average.toFixed(1)}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function searchMovies() {
            const query = document.getElementById('searchInput').value;
            if(!query) return;
            
            document.getElementById('sectionTitle').innerText = `Axtarış nəticələri: "${query}"`;
            fetchMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=${currentLang}&query=${encodeURIComponent(query)}`);
        }

        // Pleyeri açmaq və Videonu oynatmaq
        function openPlayer(movieId) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoIframe');
            
            // Seçilmiş dildən asılı olaraq açıq video pleyer mənbəyi (Auto-Embed API)
            let embedUrl = '';
            if(currentLang === 'ru-RU') {
                // Rus dili üçün pleyer
                embedUrl = `https://vidsrc.to/embed/movie/${movieId}`;
            } else {
                // Türk/İngilis dili üçün pleyer
                embedUrl = `https://multiembed.mov/?video_id=${movieId}&tmdb=1`;
            }

            iframe.src = embedUrl;
            modal.style.display = 'flex';
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoIframe');
            iframe.src = '';
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
