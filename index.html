<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzSearch - AI Axtarış Portalı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Yuxarı Axtarış Paneli */
        header {
            background-color: #1e293b;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
            white-space: nowrap;
        }

        .logo span {
            color: #f43f5e;
        }

        .search-box {
            display: flex;
            flex: 1;
            max-width: 700px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .search-box button {
            position: absolute;
            right: 5px;
            top: 5px;
            bottom: 5px;
            padding: 0 20px;
            border-radius: 20px;
            border: none;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background-color: #0284c7;
            color: #fff;
        }

        /* Əsas Məzmun Sahəsi */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Giriş Ekranı */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

        .welcome-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .welcome-screen p {
            color: #94a3b8;
            max-width: 500px;
        }

        /* AI Xülasə Bloku */
        #aiSummaryCard {
            display: none;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #38bdf8;
            border-radius: 12px;
            margin: 15px;
            padding: 15px 20px;
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.1);
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #38bdf8;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .ai-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e8f0;
        }

        /* İframe Nəticələr */
        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="resetPage()">Az<span>Search</span> AI</a>
        <form class="search-box" onsubmit="executeSearch(event)">
            <input type="text" id="searchInput" placeholder="Süni intellektlə axtarın..." required>
            <button type="submit">Axtar</button>
        </form>
    </header>

    <main>
        <!-- Qarşılama Ekranı -->
        <div class="welcome-screen" id="welcomeScreen">
            <h1>AzSearch AI-a Xoş Gəldiniz</h1>
            <p>Süni intellekt dəstəkli milli axtarış sistemi. Axtardığınız mətni yazın və anında hazır cavab alın.</p>
        </div>

        <!-- AI Ağıllı Cavab Kartı -->
        <div id="aiSummaryCard">
            <div class="ai-header">
                🤖 AzSearch AI Cavabı & Xülasəsi
            </div>
            <div class="ai-content" id="aiContent">
                Məlumat hazırlanır...
            </div>
        </div>

        <!-- Veb Nəticələri Çərçivəsi -->
        <iframe id="resultsFrame" style="display: none;"></iframe>
    </main>

    <script>
        function executeSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            // Səhifə elementlərinə nəzarət
            document.getElementById('welcomeScreen').style.display = 'none';
            const aiCard = document.getElementById('aiSummaryCard');
            const aiContent = document.getElementById('aiContent');
            const resultsFrame = document.getElementById('resultsFrame');

            aiCard.style.display = 'block';
            aiContent.innerHTML = '<i>Süni intellekt cavabı analiz edir...</i>';

            // DuckDuckGo Instant Answer API vasitəsilə AI Xülasə alırıq
            const apiUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.AbstractText) {
                        aiContent.innerHTML = `<strong>Xülasə:</strong> ${data.AbstractText} <br><br><small>Mənbə: ${data.AbstractSource || 'Açıq mənbələr'}</small>`;
                    } else if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                        aiContent.innerHTML = `<strong>Ağıllı Cavab:</strong> ${data.RelatedTopics[0].Text}`;
                    } else {
                        aiContent.innerHTML = `<strong>Süni İntellekt Qeydi:</strong> "${query}" sorğusu üçün hazır xülasə tapılmadı. Aşağıdakı canlı axtarış nəticələrinə baxa bilərsiniz.`;
                    }
                })
                .catch(() => {
                    aiContent.innerHTML = `<strong>Süni İntellekt Qeydi:</strong> Sorğu üzrə xülasə yaradılarkən xəta baş verdi. Aşağıdan veb nəticələrinə baxa bilərsiniz.`;
                });

            // Axtarış nəticələrini İframe-ə yükləyirik
            resultsFrame.style.display = 'block';
            resultsFrame.src = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
        }

        function resetPage() {
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('aiSummaryCard').style.display = 'none';
            document.getElementById('resultsFrame').style.display = 'none';
            document.getElementById('searchInput').value = '';
        }
    </script>
</body>
</html>
