    <style>

<body>

<!-- Profile Registration Modal -->
<div class="modal-overlay" id="profile-modal">
    <div class="modal-card">
        <i class="fa-solid fa-shield-halved" style="font-size: 3rem; color: var(--accent); margin-bottom: 10px;"></i>
        <h3>Milli P2P Çata Xoş Gelmisiniz</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top:5px;">Profil adınızı daxil edin. Sizin üçün dəyişməz AZ-XXXXX ID-si yaradılacaq.</p>
        <input type="text" id="username-input" placeholder="Adınız (məs: Əli Məmmədov)">
        <button onclick="saveProfile()">Daxil Ol</button>
    </div>
</div>

<div class="app-container" id="app-container">
    <!-- Sidebar: Contacts & User ID info -->
    <div class="sidebar">
        <div class="header">
            <h3 style="color: var(--accent);"><i class="fa-brands fa-whatsapp"></i> AzChat P2P</h3>
            <button class="action-btn" onclick="requestNotificationPermission()" title="Bildirişləri Aktiv Et"><i class="fa-solid fa-bell"></i></button>
        </div>

        <div class="user-id-bar">
            <div>
                <strong id="my-name-display">...</strong>
                <div style="font-size:0.75rem; color:var(--accent); font-weight:bold;" id="my-id-display">ID: Yüklənir...</div>
            </div>
            <button class="action-btn" onclick="copyMyId()" title="ID Kopyala"><i class="fa-regular fa-copy"></i></button>
        </div>

        <div class="connect-box">
            <div class="connect-box-row">
                <input type="text" id="contact-name-input" placeholder="Dostun Adı">
                <input type="text" id="remote-id-input" placeholder="AZ-12345">
                <button onclick="addContactAndConnect()"><i class="fa-solid fa-user-plus"></i></button>
            </div>
        </div>

        <div class="chat-list" id="chat-list">
            <!-- Dynamic contacts rendering -->
        </div>
    </div>

    <!-- Active Chat Screen -->
    <div class="chat-area">
        <div class="chat-header">
            <button class="back-btn" onclick="closeChatScreen()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="avatar" id="chat-avatar">?</div>
            <div>
                <h4 id="chat-title" style="font-size:0.95rem;">Çat</h4>
                <small id="status-text" style="font-size:0.7rem; color: var(--accent);">Oflayn</small>
            </div>
            <div class="call-actions">
                <button class="call-btn" onclick="startCall(false)"><i class="fa-solid fa-phone"></i></button>
                <button class="call-btn" onclick="startCall(true)"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="input-area">
            <!-- Direct Gallery Upload for Images and Videos -->
            <button class="action-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
            <input type="file" id="file-input" accept="image/*,video/*" onchange="sendFile(this.files[0])">

            <input type="text" id="message-input" placeholder="Mesaj yazın..." onkeypress="handleKeyPress(event)">

            <button class="action-btn" id="record-btn" onclick="toggleAudioRecord()"><i class="fa-solid fa-microphone"></i></button>
            <button class="action-btn" style="color: var(--accent);" onclick="sendTextMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<!-- Unified Audio & Video Call Overlay -->
<div class="call-overlay" id="call-overlay">
    <div class="call-status-header">
        <h3 id="call-user-name">Dostunuz</h3>
        <p id="call-type-text" style="color: var(--text-muted); font-size: 0.9rem;">Zəng olunur...</p>
    </div>

    <div class="call-video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay muted playsinline></video>
    </div>

    <div class="call-controls">
        <button class="btn-call btn-accept" id="btn-accept-call" onclick="acceptIncomingCall()" style="display:none;">
            <i class="fa-solid fa-phone"></i>
        </button>
        <button class="btn-call btn-decline" onclick="endOrRejectCall()">
            <i class="fa-solid fa-phone-slash"></i>
        </button>
    </div>
</div>

<script>
    // State management and persistent variables
    let peer = null;
    let conn = null;
    let currentCall = null;
    let incomingCallObject = null;
    let localStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    let myProfile = JSON.parse(localStorage.getItem('azp2p_profile')) || null;
    let contacts = JSON.parse(localStorage.getItem('azp2p_contacts')) || {};
    let chatHistory = JSON.parse(localStorage.getItem('azp2p_history')) || {};
    let activePeerId = null;

    // Web Audio API Sound Generator for Ringback & Ringtone
    let audioCtx = null;
    let ringOscillator = null;
    let ringGain = null;
    let ringInterval = null;

    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // Play synthesized dialing sound (Gudok)
    function startDialSound() {
        initAudioContext();
        stopSounds();

        ringInterval = setInterval(() => {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(425, audioCtx.currentTime); // Standard dial tone frequency
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.0); // 1-second pulse
        }, 3000);
    }

    // Play synthesized incoming ringtone
    function startRingtoneSound() {
        initAudioContext();
        stopSounds();

        ringInterval = setInterval(() => {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }, 1500);
    }

    function stopSounds() {
        if (ringInterval) {
            clearInterval(ringInterval);
            ringInterval = null;
        }
    }

    function requestNotificationPermission() {
        if ('Notification' in window) {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    alert("Bildirişlər aktiv edildi!");
                }
            });
        }
    }

    function triggerNotification(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/134/134937.png' });
        }
    }

    // Verify or register persistent AZ-XXXXX format profile
    function checkProfile() {
        if (!myProfile) {
            document.getElementById('profile-modal').style.display = 'flex';
        } else {
            document.getElementById('profile-modal').style.display = 'none';
            initApp();
        }
    }

    function saveProfile() {
        const name = document.getElementById('username-input').value.trim();
        if (!name) return alert("Xahiş olunur adınızı yazın!");

        // Generate persistent AZ-XXXXX format ID
        const randomNumber = Math.floor(10000 + Math.random() * 90000);
        const fixedId = "AZ-" + randomNumber;

        myProfile = { name: name, id: fixedId };
        localStorage.setItem('azp2p_profile', JSON.stringify(myProfile));

        document.getElementById('profile-modal').style.display = 'none';
        initApp();
    }

    function initApp() {
        document.getElementById('my-name-display').innerText = myProfile.name;
        document.getElementById('my-id-display').innerText = "ID: " + myProfile.id;

        // Initialize PeerJS with the static AZ-XXXXX format ID
        peer = new Peer(myProfile.id);

        peer.on('open', (id) => {
            console.log('P2P Şəbəkəyə qoşuldu. Sizin ID:', id);
        });

        // Incoming P2P Data Connection
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnectionListeners();
        });

        // Incoming P2P Audio/Video Call
        peer.on('call', (call) => {
            incomingCallObject = call;
            const callerId = call.peer;
            const callerName = contacts[callerId] ? contacts[callerId].name : callerId;

            startRingtoneSound();
            triggerNotification("Gələn Zəng", `${callerName} sizə zəng edir...`);

            document.getElementById('call-user-name').innerText = callerName;
            document.getElementById('call-type-text').innerText = "Gələn Zəng...";
            document.getElementById('btn-accept-call').style.display = 'flex';
            document.getElementById('call-overlay').style.display = 'flex';
        });

        renderContactsList();
    }

    function addContactAndConnect() {
        const cName = document.getElementById('contact-name-input').value.trim();
        let cId = document.getElementById('remote-id-input').value.trim().toUpperCase();

        if (!cName || !cId) return alert("Ad və AZ-XXXXX ID tam yazılmalıdır!");

        contacts[cId] = { name: cName, id: cId };
        localStorage.setItem('azp2p_contacts', JSON.stringify(contacts));

        document.getElementById('contact-name-input').value = '';
        document.getElementById('remote-id-input').value = '';

        renderContactsList();
        selectContact(cId);
    }

    function renderContactsList() {
        const listDiv = document.getElementById('chat-list');
        listDiv.innerHTML = '';

        for (let id in contacts) {
            const item = contacts[id];
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.onclick = () => selectContact(id);
            div.innerHTML = `
                <div class="avatar">${item.name[0].toUpperCase()}</div>
                <div>
                    <div style="font-weight:bold;">${escapeHtml(item.name)}</div>
                    <div style="font-size:0.75rem; color:var(--accent); font-weight:bold;">${item.id}</div>
                </div>
            `;
            listDiv.appendChild(div);
        }
    }

    function selectContact(targetId) {
        activePeerId = targetId;
        const targetName = contacts[targetId] ? contacts[targetId].name : targetId;

        document.getElementById('chat-title').innerText = targetName;
        document.getElementById('chat-avatar').innerText = targetName[0].toUpperCase();

        loadChatHistory(targetId);
        openChatScreen();

        if (!conn || conn.peer !== targetId) {
            document.getElementById('status-text').innerText = 'Qoşulur...';
            document.getElementById('status-text').style.color = '#e2a03f';
            conn = peer.connect(targetId);
            setupConnectionListeners();
        }
    }

    function setupConnectionListeners() {
        conn.on('open', () => {
            document.getElementById('status-text').innerText = 'Onlayn (P2P E2EE Active)';
            document.getElementById('status-text').style.color = 'var(--accent)';

            if (!contacts[conn.peer]) {
                contacts[conn.peer] = { name: "İstifadəçi (" + conn.peer + ")", id: conn.peer };
                localStorage.setItem('azp2p_contacts', JSON.stringify(contacts));
                renderContactsList();
            }
        });

        conn.on('data', (data) => {
            stopSounds();
            if (data.type === 'call-ended') {
                endOrRejectCall(false);
                return;
            }

            saveMessageToHistory(conn.peer, data, 'received');
            if (activePeerId === conn.peer) {
                appendMessage(data, 'received');
            } else {
                const senderName = contacts[conn.peer] ? contacts[conn.peer].name : conn.peer;
                triggerNotification("Yeni Mesaj", `${senderName}: ${data.type === 'text' ? data.content : 'Media fayl'}`);
            }
        });

        conn.on('close', () => {
            document.getElementById('status-text').innerText = 'Oflayn';
            document.getElementById('status-text').style.color = 'var(--danger)';
        });
    }

    function saveMessageToHistory(peerId, payload, side) {
        if (!chatHistory[peerId]) chatHistory[peerId] = [];
        chatHistory[peerId].push({ ...payload, side: side });
        localStorage.setItem('azp2p_history', JSON.stringify(chatHistory));
    }

    function loadChatHistory(peerId) {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';

        const history = chatHistory[peerId] || [];
        history.forEach(data => {
            appendMessage(data, data.side);
        });
    }

    function sendTextMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !activePeerId) return;

        const payload = { type: 'text', content: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };

        if (conn && conn.open) {
            conn.send(payload);
        }

        saveMessageToHistory(activePeerId, payload, 'sent');
        appendMessage(payload, 'sent');
        input.value = '';
    }

    function sendFile(file) {
        if (!file || !activePeerId) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const fileType = file.type.startsWith('image/') ? 'image' : 'video';
            const payload = {
                type: fileType,
                content: e.target.result,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            if (conn && conn.open) {
                conn.send(payload);
            }

            saveMessageToHistory(activePeerId, payload, 'sent');
            appendMessage(payload, 'sent');
        };
        reader.readAsDataURL(file);
    }

    async function toggleAudioRecord() {
        const btn = document.getElementById('record-btn');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const payload = {
                            type: 'audio',
                            content: e.target.result,
                            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                        };

                        if (conn && conn.open) {
                            conn.send(payload);
                        }

                        saveMessageToHistory(activePeerId, payload, 'sent');
                        appendMessage(payload, 'sent');
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } catch (err) {
                alert("Mikrofon icazəsi verilmir.");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.remove('recording');
        }
    }

    function startCall(isVideo) {
        if (!conn || !conn.open) return alert("Əvvəlcə qarşı tərəflə onlayn əlaqə qurulmalıdır!");

        initAudioContext();
        startDialSound();

        const targetName = contacts[conn.peer] ? contacts[conn.peer].name : conn.peer;
        document.getElementById('call-user-name').innerText = targetName;
        document.getElementById('call-type-text').innerText = isVideo ? "Görüntülü Zəng Olunur..." : "Səsli Zəng Olunur...";
        document.getElementById('btn-accept-call').style.display = 'none';
        document.getElementById('call-overlay').style.display = 'flex';

        navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }).then((stream) => {
            localStream = stream;
            document.getElementById('local-video').srcObject = stream;

            const call = peer.call(conn.peer, stream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                stopSounds();
                document.getElementById('call-type-text').innerText = "Danışıq gedir...";
                document.getElementById('remote-video').srcObject = remoteStream;
            });

            call.on('close', () => {
                endOrRejectCall(false);
            });
        }).catch(err => {
            stopSounds();
            alert("Kamera/Mikrofon icazəsi yoxdur.");
            document.getElementById('call-overlay').style.display = 'none';
        });
    }

    function acceptIncomingCall() {
        stopSounds();
        if (!incomingCallObject) return;

        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
            localStream = stream;
            document.getElementById('local-video').srcObject = stream;
            document.getElementById('btn-accept-call').style.display = 'none';
            document.getElementById('call-type-text').innerText = "Danışıq gedir...";

            incomingCallObject.answer(stream);
            currentCall = incomingCallObject;

            currentCall.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });

            currentCall.on('close', () => {
                endOrRejectCall(false);
            });
        });
    }

    function endOrRejectCall(notifyPeer = true) {
        stopSounds();

        if (notifyPeer && conn && conn.open) {
            conn.send({ type: 'call-ended' });
        }

        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }

        if (incomingCallObject) {
            incomingCallObject.close();
            incomingCallObject = null;
        }

        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }

        document.getElementById('call-overlay').style.display = 'none';
    }

    function openChatScreen() { document.getElementById('app-container').classList.add('chat-active'); }
    function closeChatScreen() { document.getElementById('app-container').classList.remove('chat-active'); }

    function appendMessage(data, side) {
        const container = document.getElementById('messages-container');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${side}`;

        let innerContent = '';
        if (data.type === 'text') {
            innerContent = `<div>${escapeHtml(data.content)}</div>`;
        } else if (data.type === 'image') {
            innerContent = `<img src="${data.content}" alt="Şəkil">`;
        } else if (data.type === 'video') {
            innerContent = `<video src="${data.content}" controls></video>`;
        } else if (data.type === 'audio') {
            innerContent = `<audio src="${data.content}" controls></audio>`;
        }

        msgDiv.innerHTML = `${innerContent}<div class="message-time">${data.time}</div>`;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendTextMessage(); }

    function copyMyId() {
        navigator.clipboard.writeText(myProfile.id);
        alert("AZ-XXXXX İD ünvanınız kopyalandı: " + myProfile.id);
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.onload = checkProfile;
</script>
