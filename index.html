<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp P2P Mobile</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- FontAwesome Iconlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: #111b21;
            --chat-bg: #0b141a;
            --message-out: #005c4b;
            --message-in: #202c33;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --accent: #00a884;
            --header-bg: #202c33;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* 1. Sol Siyahı Ekranı */
        .sidebar {
            width: 100%;
            height: 100%;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        /* 2. Sağ Çat Ekranı */
        .chat-area {
            width: 100%;
            height: 100%;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 20;
            transform: translateX(100%); /* Başlanğıcda gizli tutulur */
            transition: transform 0.3s ease;
        }

        /* Ekran Keçid Klası */
        .app-container.chat-active .chat-area {
            transform: translateX(0); /* Çat açılır */
        }

        /* Başlıq Paneli */
        .header {
            padding: 12px 15px;
            background: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 60px;
        }

        .user-id-box {
            background: #111b21;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 15px;
            border: 1px solid #222d34;
        }

        .connect-box {
            padding: 0 15px 15px 15px;
            display: flex;
            gap: 8px;
        }

        .connect-box input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #222d34;
            background: #111b21;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .connect-box button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #222d34;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .chat-item:active {
            background: #202c33;
        }

        /* Çat Header */
        .chat-header {
            padding: 10px 15px;
            background: var(--header-bg);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
        }

        .call-actions {
            margin-left: auto;
            display: flex;
            gap: 18px;
        }

        .call-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* Mesaj Siyahısı */
        .messages-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: radial-gradient(#202c33 1px, transparent 0);
            background-size: 20px 20px;
        }

        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            word-wrap: break-word;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--message-out);
            border-top-right-radius: 2px;
        }

        .message.received {
            align-self: flex-start;
            background: var(--message-in);
            border-top-left-radius: 2px;
        }

        .message img, .message video {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
        }

        .message audio {
            width: 200px;
            margin-top: 5px;
        }

        .message-time {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 3px;
        }

        /* Giriş Paneli */
        .input-area {
            padding: 8px 10px;
            background: var(--header-bg);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: none;
            background: #2a3942;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 6px;
            cursor: pointer;
        }

        .action-btn.recording {
            color: #ff4b4b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Video Call Modal */
        .video-call-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        .video-grid {
            flex: 1;
            position: relative;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #local-video {
            width: 100px;
            height: 140px;
            object-fit: cover;
            position: absolute;
            top: 20px;
            right: 20px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }

        .end-call-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4b4b;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

<div class="app-container" id="app-container">
    <!-- Sol Ekran: Siyahı və İD -->
    <div class="sidebar">
        <div class="header">
            <h3 style="color: var(--accent);">WhatsApp P2P</h3>
        </div>

        <div style="font-size:0.75rem; color:var(--text-muted); margin: 10px 15px 0 15px;">SİZİN MƏXFİ İD ÜNVANINIZ:</div>
        <div class="user-id-box">
            <span id="my-peer-id" style="word-break: break-all;">Yüklənir...</span>
            <button style="background:none; border:none; color:#fff; margin-left:10px;" onclick="copyMyId()"><i class="fa-regular fa-copy"></i></button>
        </div>

        <div class="connect-box">
            <input type="text" id="remote-id-input" placeholder="Qarşı tərəfin İD-si...">
            <button onclick="connectToPeer()"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div class="chat-list" id="chat-list">
            <div class="chat-item" onclick="openChatScreen()" id="active-chat-item" style="display:none;">
                <i class="fa-solid fa-user-shield" style="font-size: 1.8rem; color: var(--accent);"></i>
                <div style="flex:1;">
                    <div id="active-peer-name" style="font-weight:bold;">Şifrələnmiş Kanal</div>
                    <div id="status-text-sub" style="font-size:0.75rem; color: var(--accent);">Əlaqə quruldu</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sağ Ekran: Çat Pəncərəsi -->
    <div class="chat-area">
        <div class="chat-header">
            <button class="back-btn" onclick="closeChatScreen()"><i class="fa-solid fa-arrow-left"></i></button>
            <div>
                <h4 id="chat-title" style="font-size:0.95rem;">Şifrələnmiş Çat</h4>
                <small id="status-text" style="font-size:0.7rem; color: var(--accent);">P2P Aktivdir</small>
            </div>
            <div class="call-actions">
                <button class="call-btn" onclick="startCall(false)"><i class="fa-solid fa-phone"></i></button>
                <button class="call-btn" onclick="startCall(true)"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="input-area">
            <button class="action-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
            <input type="file" id="file-input" accept="image/*,video/*" onchange="sendFile(this.files[0])">

            <input type="text" id="message-input" placeholder="Mesaj..." onkeypress="handleKeyPress(event)">

            <button class="action-btn" id="record-btn" onclick="toggleAudioRecord()"><i class="fa-solid fa-microphone"></i></button>
            <button class="action-btn" style="color: var(--accent);" onclick="sendTextMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <!-- Video Zəng -->
        <div class="video-call-overlay" id="video-overlay">
            <div class="video-grid">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay muted playsinline></video>
            </div>
            <button class="end-call-btn" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let conn = null;
    let currentCall = null;
    let localStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function initPeer() {
        peer = new Peer();

        peer.on('open', (id) => {
            document.getElementById('my-peer-id').innerText = id;
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnectionListeners();
        });

        peer.on('call', (call) => {
            if (confirm("Gələn zəng var! Qəbul edirsiniz?")) {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                    localStream = stream;
                    document.getElementById('local-video').srcObject = stream;
                    document.getElementById('video-overlay').style.display = 'flex';
                    call.answer(stream);
                    currentCall = call;

                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                    });
                });
            }
        });
    }

    function connectToPeer() {
        const remoteId = document.getElementById('remote-id-input').value.trim();
        if (!remoteId) return alert("İD daxil edin!");

        conn = peer.connect(remoteId);
        setupConnectionListeners();
    }

    function setupConnectionListeners() {
        conn.on('open', () => {
            document.getElementById('active-chat-item').style.display = 'flex';
            document.getElementById('active-peer-name').innerText = "İD: " + conn.peer.substring(0, 10) + "...";
            openChatScreen();
        });

        conn.on('data', (data) => {
            renderIncomingData(data);
        });

        conn.on('close', () => {
            alert("Əlaqə kəsildi");
            closeChatScreen();
        });
    }

    function openChatScreen() {
        document.getElementById('app-container').classList.add('chat-active');
    }

    function closeChatScreen() {
        document.getElementById('app-container').classList.remove('chat-active');
    }

    function sendTextMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !conn) return;

        const payload = { type: 'text', content: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
        conn.send(payload);
        appendMessage(payload, 'sent');
        input.value = '';
    }

    function sendFile(file) {
        if (!file || !conn) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const fileType = file.type.startsWith('image/') ? 'image' : 'video';
            const payload = {
                type: fileType,
                content: e.target.result,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };
            conn.send(payload);
            appendMessage(payload, 'sent');
        };
        reader.readAsDataURL(file);
    }

    async function toggleAudioRecord() {
        const btn = document.getElementById('record-btn');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const payload = {
                            type: 'audio',
                            content: e.target.result,
                            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                        };
                        conn.send(payload);
                        appendMessage(payload, 'sent');
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } catch (err) {
                alert("Mikrofon icazəsi verilmədi.");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.remove('recording');
        }
    }

    function startCall(isVideo) {
        if (!conn) return alert("Əvvəlcə əlaqə yaradın!");

        navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }).then((stream) => {
            localStream = stream;
            document.getElementById('local-video').srcObject = stream;
            document.getElementById('video-overlay').style.display = 'flex';

            const call = peer.call(conn.peer, stream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        });
    }

    function endCall() {
        if (currentCall) currentCall.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        document.getElementById('video-overlay').style.display = 'none';
    }

    function renderIncomingData(data) {
        appendMessage(data, 'received');
    }

    function appendMessage(data, side) {
        const container = document.getElementById('messages-container');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${side}`;

        let innerContent = '';
        if (data.type === 'text') {
            innerContent = `<div>${escapeHtml(data.content)}</div>`;
        } else if (data.type === 'image') {
            innerContent = `<img src="${data.content}">`;
        } else if (data.type === 'video') {
            innerContent = `<video src="${data.content}" controls></video>`;
        } else if (data.type === 'audio') {
            innerContent = `<audio src="${data.content}" controls></audio>`;
        }

        msgDiv.innerHTML = `${innerContent}<div class="message-time">${data.time}</div>`;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendTextMessage();
    }

    function copyMyId() {
        const idText = document.getElementById('my-peer-id').innerText;
        navigator.clipboard.writeText(idText);
        alert("İD kopyalandı!");
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.onload = initPeer;
</script>
</body>
</html>
