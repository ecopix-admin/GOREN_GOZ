<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UstaTAP - Təmir & Xidmət Platforması</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        .header {
            background: #0284c7;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .container {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Kateqoriya Düymələri */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 14px;
        }

        /* Usta Kartı */
        .master-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .master-name {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .master-service {
            font-size: 14px;
            color: var(--text-muted);
        }

        .price-tag {
            background: #0369a1;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            width: fit-content;
        }

        .call-btn {
            background: var(--btn-green);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 5px;
        }

        /* Alt Naviqasiya Menyusu */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #090d16;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #334155;
        }

        .nav-item {
            color: var(--text-muted);
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item i {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        /* Form Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content input, .modal-content select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }

        .modal-content button {
            padding: 10px;
            background: var(--accent-color);
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        🛠️ UstaTAP - Xidmət Portalı
    </div>

    <div class="container">
        <!-- Kateqoriyalar -->
        <div class="categories">
            <button class="cat-btn" onclick="filterMaster('barchasi')">Bütün Xidmətlər</button>
            <button class="cat-btn" onclick="filterMaster('şpatlyovka')">Şpatlyovka</button>
            <button class="cat-btn" onclick="filterMaster('alçipan')">Alçipan</button>
            <button class="cat-btn" onclick="filterMaster('təmir')">A-dan Z-yə Təmir</button>
        </div>

        <!-- Ustaların Siyahısı -->
        <div id="masters-list"></div>
    </div>

    <!-- Alt Menyu -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showSection('home')">
            <i class="fa-solid fa-house"></i>
            <span>Ana Səhifə</span>
        </div>
        <div class="nav-item" onclick="openModal()">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Elan Əlavə Et</span>
        </div>
    </div>

    <!-- Elan Əlavə Etmə Modalı -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3 style="color: var(--accent-color);">Usta Profilinizi Yaratın</h3>
            <input type="text" id="masterName" placeholder="Ad və Soyadınız">
            <select id="masterCategory">
                <option value="şpatlyovka">Şpatlyovka Ustası</option>
                <option value="alçipan">Alçipan Ustası</option>
                <option value="təmir">Tam Təmir Ustası</option>
            </select>
            <input type="text" id="masterPrice" placeholder="Qiymət (Məs: 3-5 AZN / kv.m)">
            <input type="tel" id="masterPhone" placeholder="Telefon Nömrəniz (+994...)">
            <button onclick="saveMaster()">Elanı Dərc Et (Ödənişsiz)</button>
            <button style="background: #ef233c; color: white;" onclick="closeModal()">Ləğv Et</button>
        </div>
    </div>

    <script>
        const initialMasters = [
            { id: 1, name: "Səmir Usta", cat: "şpatlyovka", price: "4 - 6 AZN / kv.m", phone: "+994501234567" },
            { id: 2, name: "Rəşad Usta", cat: "alçipan", price: "5 - 8 AZN / kv.m", phone: "+994559876543" },
            { id: 3, name: "Kamil Usta", cat: "təmir", price: "Razılaşma yolu ilə", phone: "+994705554433" }
        ];

        function renderMasters(list) {
            const container = document.getElementById('masters-list');
            container.innerHTML = '';
            list.forEach(m => {
                container.innerHTML += `
                    <div class="master-card">
                        <div class="master-header">
                            <span class="master-name">${m.name}</span>
                            <span class="price-tag">${m.price}</span>
                        </div>
                        <div class="master-service">Xidmət: ${m.cat.toUpperCase()}</div>
                        <a href="tel:${m.phone}" class="call-btn">
                            <i class="fa-solid fa-phone"></i> Zəng Et: ${m.phone}
                        </a>
                    </div>
                `;
            });
        }

        function filterMaster(category) {
            let masters = JSON.parse(localStorage.getItem('my_masters')) || initialMasters;
            if (category === 'barchasi') {
                renderMasters(masters);
            } else {
                const filtered = masters.filter(m => m.cat === category);
                renderMasters(filtered);
            }
        }

        function openModal() {
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        function saveMaster() {
            const name = document.getElementById('masterName').value;
            const cat = document.getElementById('masterCategory').value;
            const price = document.getElementById('masterPrice').value;
            const phone = document.getElementById('masterPhone').value;

            if(!name || !price || !phone) {
                alert("Zəhmət olmasa bütün xanaları doldurun!");
                return;
            }

            let masters = JSON.parse(localStorage.getItem('my_masters')) || initialMasters;
            masters.unshift({ id: Date.now(), name, cat, price, phone });
            localStorage.setItem('my_masters', JSON.stringify(masters));

            renderMasters(masters);
            closeModal();
            alert("Elanınız uğurla yerləşdirildi!");
        }

        window.onload = () => {
            let masters = JSON.parse(localStorage.getItem('my_masters')) || initialMasters;
            renderMasters(masters);
        };
    </script>
</body>
</html>
