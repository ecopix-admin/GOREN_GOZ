<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AzChat P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: #111b21;
            --chat-bg: #0b141a;
            --message-out: #005c4b;
            --message-in: #202c33;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --accent: #00a884;
            --header-bg: #202c33;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100%; width: 100%;
            overflow: hidden;
        }

        .app-container {
            width: 100%; height: 100%;
            display: flex; position: relative;
            overflow: hidden;
        }

        /* Modal - Giriş */
        .profile-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 20, 26, 0.98);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; padding: 20px;
        }

        .modal-box {
            background: var(--panel-bg);
            padding: 25px; border-radius: 12px;
            width: 100%; max-width: 360px;
            text-align: center; border: 1px solid #222d34;
        }

        .modal-box input {
            width: 100%; padding: 12px; margin: 15px 0;
            border-radius: 8px; border: 1px solid #222d34;
            background: #111b21; color: #fff; outline: none; font-size: 1rem;
        }

        .modal-box button {
            width: 100%; padding: 12px; background: var(--accent);
            border: none; color: #fff; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        /* Ekranlar */
        .sidebar {
            width: 100%; height: 100%;
            background: var(--panel-bg);
            display: flex; flex-direction: column;
            position: absolute; left: 0; top: 0; z-index: 10;
            transition: transform 0.3s ease;
        }

        .chat-area {
            width: 100%; height: 100%;
            background: var(--chat-bg);
            display: flex; flex-direction: column;
            position: absolute; left: 0; top: 0; z-index: 20;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .app-container.chat-active .chat-area {
            transform: translateX(0);
        }

        .header {
            padding: 12px 15px; background: var(--header-bg);
            display: flex; align-items: center; justify-content: space-between;
        }

        .user-info-bar {
            background: #111b21; padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #222d34;
        }

        .add-friend-box {
            padding: 12px 15px; background: var(--panel-bg);
            border-bottom: 1px solid #222d34;
        }

        .add-friend-title {
            font-size: 0.8rem; color: var(--accent); margin-bottom: 8px; font-weight: bold;
        }

        .inputs-row {
            display: flex; gap: 8px;
        }

        .inputs-row input {
            padding: 10px; border-radius: 8px;
            border: 1px solid #222d34; background: #111b21;
            color: #fff; outline: none; font-size: 0.85rem;
        }

        .inputs-row input:nth-child(1) { flex: 1.2; }
        .inputs-row input:nth-child(2) { flex: 1; }

        .add-btn {
            background: var(--accent); border: none; color: #fff;
            padding: 0 16px; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 1rem;
        }

        .chat-list { flex: 1; overflow-y: auto; }

        .chat-item {
            padding: 14px 15px; border-bottom: 1px solid #222d34;
            display: flex; align-items: center; gap: 12px; cursor: pointer;
        }

        .chat-item:active { background: #202c33; }

        .avatar {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--accent); display: flex;
            justify-content: center; align-items: center;
            font-weight: bold; font-size: 1.2rem; color: #fff;
        }

        /* Çat İnterfeysi */
        .chat-header {
            padding: 10px 15px; background: var(--header-bg);
            display: flex; align-items: center; gap: 10px;
        }

        .back-btn { background: none; border: none; color: var(--text-main); font-size: 1.2rem; cursor: pointer; }
        .call-actions { margin-left: auto; display: flex; gap: 18px; }
        .call-btn { background: none; border: none; color: var(--text-main); font-size: 1.1rem; cursor: pointer; }

        .messages-container {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
            background-image: radial-gradient(#202c33 1px, transparent 0);
            background-size: 20px 20px;
        }

        .message {
            max-width: 80%; padding: 8px 12px; border-radius: 8px;
            font-size: 0.9rem; word-wrap: break-word;
        }

        .message.sent { align-self: flex-end; background: var(--message-out); border-top-right-radius: 2px; }
        .message.received { align-self: flex-start; background: var(--message-in); border-top-left-radius: 2px; }
        .message img, .message video { max-width: 100%; border-radius: 6px; margin-top: 5px; }
        .message audio { width: 200px; margin-top: 5px; }
        .message-time { font-size: 0.65rem; color: var(--text-muted); text-align: right; margin-top: 3px; }

        .input-area {
            padding: 8px 10px; background: var(--header-bg);
            display: flex; align-items: center; gap: 8px;
        }

        .input-area input[type="text"] {
            flex: 1; padding: 10px 14px; border-radius: 20px;
            border: none; background: #2a3942; color: #fff; outline: none; font-size: 0.95rem;
        }

        .action-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; padding: 6px; cursor: pointer; }
        .action-btn.recording { color: #ff4b4b; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Zəng Modalı */
        .video-call-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column; z-index: 1000;
        }

        .video-grid { flex: 1; position: relative; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { width: 100px; height: 140px; object-fit: cover; position: absolute; top: 20px; right: 20px; border-radius: 10px; border: 2px solid var(--accent); }
        .end-call-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ff4b4b; color: white; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; }

        #file-input { display: none; }
    </style>
</head>
<body>

<!-- Giriş Modalı -->
<div class="profile-modal" id="profile-modal">
    <div class="modal-box">
        <h3 style="color:var(--accent); margin-bottom:10px;">AzChat P2P</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Profil adınızı yazın</p>
        <input type="text" id="username-input" placeholder="Adınız (məs: Şamxal)">
        <button onclick="saveProfile()">Təsdiqlə</button>
    </div>
</div>

<div class="app-container" id="app-container">
    <!-- Sol Panel: Kontaktlar -->
    <div class="sidebar">
        <div class="header">
            <h3 style="color: var(--accent);"><i class="fa-brands fa-whatsapp"></i> AzChat P2P</h3>
            <button class="action-btn" onclick="requestNotificationPermission()"><i class="fa-solid fa-bell"></i></button>
        </div>

        <div class="user-info-bar">
            <div>
                <strong id="my-name-display">...</strong>
                <div style="font-size:0.75rem; color:var(--accent); font-weight:bold; margin-top:2px;" id="my-id-display">ID: Yüklənir...</div>
            </div>
            <button class="action-btn" onclick="copyMyId()"><i class="fa-regular fa-copy"></i></button>
        </div>

        <!-- Dost Əlavə Etmə Qutusu -->
        <div class="add-friend-box">
            <div class="add-friend-title">YENİ DOST ƏLAVƏ ET</div>
            <div class="inputs-row">
                <input type="text" id="contact-name-input" placeholder="Dostun adı">
                <input type="text" id="remote-id-input" placeholder="AZ-XXXXX">
                <button class="add-btn" onclick="addContactAndConnect()"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>

        <div class="chat-list" id="chat-list"></div>
    </div>

    <!-- Sağ Panel: Çat Ekranı -->
    <div class="chat-area">
        <div class="chat-header">
            <button class="back-btn" onclick="closeChatScreen()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="avatar" id="chat-avatar">?</div>
            <div>
                <h4 id="chat-title" style="font-size:0.95rem;">Çat</h4>
                <small id="status-text" style="font-size:0.7rem; color: var(--accent);">Oflayn</small>
            </div>
            <div class="call-actions">
                <button class="call-btn" onclick="startCall(false)"><i class="fa-solid fa-phone"></i></button>
                <button class="call-btn" onclick="startCall(true)"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="input-area">
            <button class="action-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
            <input type="file" id="file-input" accept="image/*,video/*" onchange="sendFile(this.files[0])">

            <input type="text" id="message-input" placeholder="Mesaj yazın..." onkeypress="handleKeyPress(event)">

            <button class="action-btn" id="record-btn" onclick="toggleAudioRecord()"><i class="fa-solid fa-microphone"></i></button>
            <button class="action-btn" style="color: var(--accent);" onclick="sendTextMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <!-- Video Zəng Modal -->
        <div class="video-call-overlay" id="video-overlay">
            <div class="video-grid">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay muted playsinline></video>
            </div>
            <button class="end-call-btn" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let conn = null;
    let currentCall = null;
    let localStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    let myProfile = JSON.parse(localStorage.getItem('azchat_profile')) || null;
    let contacts = JSON.parse(localStorage.getItem('azchat_contacts')) || {};
    let chatHistory = JSON.parse(localStorage.getItem('azchat_history')) || {};
    let activePeerId = null;

    // Səs Sintezatoru (Qudok və Zəng Səsi Üçün)
    let audioCtx = null;
    let ringInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTone(freq1, freq2, duration) {
        initAudio();
        let osc1 = audioCtx.createOscillator();
        let osc2 = audioCtx.createOscillator();
        let gain = audioCtx.createGain();

        osc1.frequency.value = freq1;
        osc2.frequency.value = freq2;

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        gain.gain.value = 0.1;
        osc1.start();
        osc2.start();

        setTimeout(() => {
            osc1.stop();
            osc2.stop();
        }, duration);
    }

    function startRingbackSound() { // Qudok Səsi (tut... tut...)
        stopRingtone();
        playTone(425, 425, 1000);
        ringInterval = setInterval(() => {
            playTone(425, 425, 1000);
        }, 3000);
    }

    function startIncomingRingtone() { // Gələn Zəng Səsi
        stopRingtone();
        playTone(800, 900, 1500);
        ringInterval = setInterval(() => {
            playTone(800, 900, 1500);
        }, 2500);
    }

    function stopRingtone() {
        if (ringInterval) {
            clearInterval(ringInterval);
            ringInterval = null;
        }
    }

    // Bildiriş Göndərmə
    function requestNotificationPermission() {
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("Bildirişlər aktiv edildi!");
                }
            });
        }
    }

    function sendNotification(title, body) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/124/124034.png' });
        }
    }

    // Profil və İD Tənzimləməsi
    function checkProfile() {
        if (!myProfile) {
            document.getElementById('profile-modal').style.display = 'flex';
        } else {
            document.getElementById('profile-modal').style.display = 'none';
            initApp();
        }
    }

    function saveProfile() {
        const name = document.getElementById('username-input').value.trim();
        if (!name) return alert("Xahiş olunur adınızı yazın!");

        // AZ-XXXXX formatında dəyişməz İD
        const randomNum = Math.floor(10000 + Math.random() * 90000);
        const fixedId = "AZ-" + randomNum;

        myProfile = { name: name, id: fixedId };
        localStorage.setItem('azchat_profile', JSON.stringify(myProfile));

        document.getElementById('profile-modal').style.display = 'none';
        initApp();
    }

    function initApp() {
        document.getElementById('my-name-display').innerText = myProfile.name;
        document.getElementById('my-id-display').innerText = "ID: " + myProfile.id;

        peer = new Peer(myProfile.id);

        peer.on('open', (id) => {
            console.log("P2P Şəbəkə hazır. ID:", id);
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnectionListeners();
        });

        peer.on('call', (call) => {
            startIncomingRingtone();
            sendNotification("Gələn Zəng", "Sizə zəng gəlir...");

            if (confirm("Gələn zəng var! Cavab verirsiniz?")) {
                stopRingtone();
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                    localStream = stream;
                    document.getElementById('local-video').srcObject = stream;
                    document.getElementById('video-overlay').style.display = 'flex';
                    call.answer(stream);
                    currentCall = call;

                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                    });
                });
            } else {
                stopRingtone();
            }
        });

        renderContactsList();
    }

    // Dost Əlavə Etmə
    function addContactAndConnect() {
        const cName = document.getElementById('contact-name-input').value.trim();
        let cId = document.getElementById('remote-id-input').value.trim().toUpperCase();

        if (!cName || !cId) return alert("Həm adı, həm də İD-ni daxil edin!");

        contacts[cId] = { name: cName, id: cId };
        localStorage.setItem('azchat_contacts', JSON.stringify(contacts));

        document.getElementById('contact-name-input').value = '';
        document.getElementById('remote-id-input').value = '';

        renderContactsList();
        selectContact(cId);
    }

    function renderContactsList() {
        const listDiv = document.getElementById('chat-list');
        listDiv.innerHTML = '';

        for (let id in contacts) {
            const item = contacts[id];
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.onclick = () => selectContact(id);
            div.innerHTML = `
                <div class="avatar">${item.name[0].toUpperCase()}</div>
                <div>
                    <div style="font-weight:bold; font-size:0.95rem;">${escapeHtml(item.name)}</div>
                    <div style="font-size:0.75rem; color:var(--accent); font-weight:bold; margin-top:2px;">${item.id}</div>
                </div>
            `;
            listDiv.appendChild(div);
        }
    }

    function selectContact(targetId) {
        activePeerId = targetId;
        const targetName = contacts[targetId] ? contacts[targetId].name : "Dost";

        document.getElementById('chat-title').innerText = targetName;
        document.getElementById('chat-avatar').innerText = targetName[0].toUpperCase();

        loadChatHistory(targetId);
        openChatScreen();

        if (!conn || conn.peer !== targetId) {
            document.getElementById('status-text').innerText = 'Qoşulur...';
            document.getElementById('status-text').style.color = '#e2a03f';
            conn = peer.connect(targetId);
            setupConnectionListeners();
        }
    }

    function setupConnectionListeners() {
        conn.on('open', () => {
            document.getElementById('status-text').innerText = 'Onlayn (P2P E2EE)';
            document.getElementById('status-text').style.color = 'var(--accent)';

            if (!contacts[conn.peer]) {
                contacts[conn.peer] = { name: "Dost (" + conn.peer + ")", id: conn.peer };
                localStorage.setItem('azchat_contacts', JSON.stringify(contacts));
                renderContactsList();
            }
        });

        conn.on('data', (data) => {
            saveMessageToHistory(conn.peer, data, 'received');
            if (activePeerId === conn.peer) {
                appendMessage(data, 'received');
            } else {
                sendNotification("Yeni Mesaj", data.content || "Media faylı");
            }
        });

        conn.on('close', () => {
            document.getElementById('status-text').innerText = 'Oflayn';
            document.getElementById('status-text').style.color = '#ff4b4b';
        });
    }

    function saveMessageToHistory(peerId, payload, side) {
        if (!chatHistory[peerId]) chatHistory[peerId] = [];
        chatHistory[peerId].push({ ...payload, side: side });
        localStorage.setItem('azchat_history', JSON.stringify(chatHistory));
    }

    function loadChatHistory(peerId) {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        const history = chatHistory[peerId] || [];
        history.forEach(data => appendMessage(data, data.side));
    }

    function sendTextMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !activePeerId) return;

        const payload = { type: 'text', content: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };

        if (conn && conn.open) conn.send(payload);

        saveMessageToHistory(activePeerId, payload, 'sent');
        appendMessage(payload, 'sent');
        input.value = '';
    }

    function sendFile(file) {
        if (!file || !activePeerId) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const fileType = file.type.startsWith('image/') ? 'image' : 'video';
            const payload = {
                type: fileType,
                content: e.target.result,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            if (conn && conn.open) conn.send(payload);

            saveMessageToHistory(activePeerId, payload, 'sent');
            appendMessage(payload, 'sent');
        };
        reader.readAsDataURL(file);
    }

    async function toggleAudioRecord() {
        const btn = document.getElementById('record-btn');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const payload = {
                            type: 'audio',
                            content: e.target.result,
                            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                        };

                        if (conn && conn.open) conn.send(payload);

                        saveMessageToHistory(activePeerId, payload, 'sent');
                        appendMessage(payload, 'sent');
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } catch (err) {
                alert("Mikrofon icazəsi yoxdur.");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.remove('recording');
        }
    }

    function startCall(isVideo) {
        if (!conn || !conn.open) return alert("Əvvəlcə qarşı tərəf onlayn olmalıdır!");

        startRingbackSound();

        navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }).then((stream) => {
            localStream = stream;
            document.getElementById('local-video').srcObject = stream;
            document.getElementById('video-overlay').style.display = 'flex';

            const call = peer.call(conn.peer, stream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                stopRingtone();
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        });
    }

    function endCall() {
        stopRingtone();
        if (currentCall) currentCall.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        document.getElementById('video-overlay').style.display = 'none';
    }

    function openChatScreen() { document.getElementById('app-container').classList.add('chat-active'); }
    function closeChatScreen() { document.getElementById('app-container').classList.remove('chat-active'); }

    function appendMessage(data, side) {
        const container = document.getElementById('messages-container');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${side}`;

        let innerContent = '';
        if (data.type === 'text') innerContent = `<div>${escapeHtml(data.content)}</div>`;
        else if (data.type === 'image') innerContent = `<img src="${data.content}">`;
        else if (data.type === 'video') innerContent = `<video src="${data.content}" controls></video>`;
        else if (data.type === 'audio') innerContent = `<audio src="${data.content}" controls></audio>`;

        msgDiv.innerHTML = `${innerContent}<div class="message-time">${data.time}</div>`;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendTextMessage(); }

    function copyMyId() {
        navigator.clipboard.writeText(myProfile.id);
        alert("Sizin İD kopyalandı: " + myProfile.id);
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.onload = checkProfile;
</script>
</body>
</html>
