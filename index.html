<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArticleHub — Müasir Məqalə Platforması</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 70px; /* Mobil alt menyu üçün yer */
        }

        @media (min-width: 992px) {
            body { padding-bottom: 0; }
        }

        /* Header */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 0.5rem;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            flex: 1;
            max-width: 400px;
            margin: 0 0.5rem;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text);
            width: 100%;
            outline: none;
            font-size: 0.85rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

        /* Structural Layout */
        .container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Sidebar - Masaüstü üçün */
        aside {
            width: 240px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            padding: 1.2rem;
            display: none; /* Mobildə gizlədilir */
            flex-direction: column;
            gap: 0.5rem;
            shrink: 0;
        }

        @media (min-width: 992px) {
            aside { display: flex; }
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 1rem;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .menu-item:hover, .menu-item.active {
            background: var(--primary);
            color: white;
        }

        /* Mobil Alt Menyu (Bottom Nav) */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 0;
            z-index: 999;
        }

        @media (min-width: 992px) {
            .mobile-nav { display: none; }
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            gap: 0.2rem;
        }

        .mobile-nav-item.active, .mobile-nav-item:hover {
            color: var(--primary);
        }

        .mobile-nav-item i {
            font-size: 1.2rem;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 1rem;
            width: 100%;
            overflow-x: hidden;
        }

        @media (min-width: 768px) {
            main { padding: 1.5rem; }
        }

        /* Articles Feed Grid */
        .feed-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        @media (min-width: 600px) {
            .feed-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 1024px) {
            .feed-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            flex: 1;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .author-details h4 { font-size: 0.88rem; }
        .author-details p { font-size: 0.72rem; color: var(--text-muted); }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            cursor: pointer;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            padding-top: 0.6rem;
            margin-top: auto;
        }

        .stat-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .ad-banner {
            background: linear-gradient(45deg, #2563eb, #7c3aed);
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1.2rem;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .ad-overlay {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            position: relative;
        }

        .ad-timer {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(0,0,0,0.8);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .form-group { margin-bottom: 0.8rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-size: 0.85rem; color: var(--text-muted); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.6rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); outline: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo" onclick="showSection('feed')">
            <i class="fa-solid fa-newspaper"></i> ArticleHub
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
            <input type="text" id="searchInput" placeholder="Axtarış..." onkeyup="searchArticles()">
        </div>
        <div class="nav-actions" id="navActions"></div>
    </header>

    <div class="container">
        <!-- Desktop Sidebar -->
        <aside>
            <a class="menu-item active" onclick="showSection('feed')"><i class="fa-solid fa-house"></i> Ana Səhifə</a>
            <a class="menu-item" onclick="showSection('popular')"><i class="fa-solid fa-fire"></i> Populyar</a>
            <a class="menu-item" onclick="showSection('authors')"><i class="fa-solid fa-users"></i> Yazarlar</a>
            <a class="menu-item" onclick="openCreateArticleModal()"><i class="fa-solid fa-pen-to-square"></i> Məqalə Yaz</a>
            <a class="menu-item" onclick="showSection('profile')"><i class="fa-solid fa-user"></i> Profil & Qazanc</a>
        </aside>

        <!-- Main Content -->
        <main id="mainContent">
            <div class="ad-banner">🚀 Reklam Alanı — Biznesinizi İnkişaf Etdirin!</div>
            <div class="feed-grid" id="articlesGrid"></div>
        </main>
    </div>

    <!-- Mobil Alt Naviqasiya Paneli -->
    <div class="mobile-nav">
        <div class="mobile-nav-item active" onclick="showSection('feed')">
            <i class="fa-solid fa-house"></i>
            <span>Ana Səhifə</span>
        </div>
        <div class="mobile-nav-item" onclick="showSection('popular')">
            <i class="fa-solid fa-fire"></i>
            <span>Populyar</span>
        </div>
        <div class="mobile-nav-item" onclick="openCreateArticleModal()">
            <i class="fa-solid fa-plus-circle" style="color: var(--primary); font-size: 1.4rem;"></i>
            <span>Yaz</span>
        </div>
        <div class="mobile-nav-item" onclick="showSection('authors')">
            <i class="fa-solid fa-users"></i>
            <span>Yazarlar</span>
        </div>
        <div class="mobile-nav-item" onclick="showSection('profile')">
            <i class="fa-solid fa-user"></i>
            <span>Profil</span>
        </div>
    </div>

    <!-- Modallar -->
    <div class="modal-overlay" id="articleModal">
        <div class="modal">
            <button class="close-modal" onclick="closeModal('articleModal')">&times;</button>
            <div class="ad-overlay" id="videoAdContainer">
                <div class="ad-timer" id="adTimer">Reklam: 3 san</div>
                <div style="text-align: center; color: white;">
                    <i class="fa-solid fa-rectangle-ad fa-2x" style="color: #f59e0b;"></i>
                    <p style="margin-top: 5px; font-size: 0.85rem;">Sponsorlu Reklam...</p>
                </div>
            </div>

            <div id="articleContent" class="hidden">
                <h2 id="modalTitle" style="margin-bottom: 0.8rem; font-size: 1.2rem;"></h2>
                <div class="author-info" style="margin-bottom: 0.8rem;">
                    <img id="modalAuthorImg" src="" class="avatar">
                    <div class="author-details">
                        <h4 id="modalAuthorName"></h4>
                        <p id="modalDate"></p>
                    </div>
                </div>
                <img id="modalImg" src="" style="width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 0.8rem;">
                <p id="modalBodyText" style="line-height: 1.5; color: #cbd5e1; font-size: 0.9rem; margin-bottom: 1rem;"></p>
                
                <div style="display: flex; gap: 0.5rem; border-top: 1px solid var(--border); padding-top: 0.8rem;">
                    <button class="btn btn-outline" onclick="likeCurrentArticle()"><i class="fa-solid fa-thumbs-up"></i> <span id="modalLikeCount">0</span></button>
                    <button class="btn btn-outline" onclick="copyArticleLink()"><i class="fa-solid fa-copy"></i> Kopyala</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <button class="close-modal" onclick="closeModal('authModal')">&times;</button>
            <h3 style="margin-bottom: 1rem; text-align: center;">Giriş / Qeydiyyat</h3>
            <div class="form-group"><label>Ad Soyad</label><input type="text" id="regName"></div>
            <div class="form-group"><label>E-poçt</label><input type="email" id="regEmail"></div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" onclick="registerUser()">Daxil ol</button>
        </div>
    </div>

    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <button class="close-modal" onclick="closeModal('createModal')">&times;</button>
            <h3 style="margin-bottom: 1rem;">Yeni Məqalə</h3>
            <div class="form-group"><label>Başlıq</label><input type="text" id="createTitle"></div>
            <div class="form-group"><label>Məzmun</label><textarea id="createBody" rows="4"></textarea></div>
            <button class="btn btn-primary" style="width: 100%;" onclick="publishArticle()">Dərc et</button>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        let articles = JSON.parse(localStorage.getItem('articles')) || [];

        const names = ["Aysel", "Rauf", "Elvin", "Leyla", "Murad", "Nigar", "Cavid", "Zəhra"];
        const surnames = ["Məmmədov", "Əliyev", "Həsənov", "Hüseynov", "Quliyev"];

        function initFakeData() {
            if (articles.length === 0) {
                for (let i = 1; i <= 20; i++) {
                    const randomName = names[i % names.length] + " " + surnames[i % surnames.length];
                    articles.push({
                        id: 'art_' + i,
                        title: "Məqalə Başlığı #" + i,
                        body: "Bu, mobil interfeys üçün optimallaşdırılmış nümunə məqalə mətnidir.",
                        image: `https://picsum.photos/seed/${i + 5}/500/300`,
                        author: { name: randomName, avatar: `https://i.pravatar.cc/100?img=${i}` },
                        views: Math.floor(Math.random() * 5000) + 100,
                        likes: Math.floor(Math.random() * 200) + 10,
                        date: "21 Sentyabr"
                    });
                }
                localStorage.setItem('articles', JSON.stringify(articles));
            }
        }

        window.onload = function() {
            initFakeData();
            updateNav();
            renderArticles(articles);
        };

        function updateNav() {
            const nav = document.getElementById('navActions');
            if (currentUser) {
                nav.innerHTML = `<span style="font-size:0.8rem; font-weight:600;">${currentUser.name}</span>`;
            } else {
                nav.innerHTML = `<button class="btn btn-primary" onclick="openModal('authModal')">Giriş</button>`;
            }
        }

        function showSection(section) {
            const main = document.getElementById('mainContent');
            if (section === 'feed') {
                main.innerHTML = `<div class="ad-banner">🚀 Reklam Alanı — Biznesinizi İnkişaf Etdirin!</div><div class="feed-grid" id="articlesGrid"></div>`;
                renderArticles(articles);
            } else if (section === 'popular') {
                const sorted = [...articles].sort((a, b) => b.views - a.views);
                main.innerHTML = `<h3 style="margin-bottom:1rem;">🔥 Populyar Məqalələr</h3><div class="feed-grid" id="articlesGrid"></div>`;
                renderArticles(sorted);
            } else if (section === 'authors') {
                main.innerHTML = `<h3 style="margin-bottom:1rem;">👥 Aktiv Yazarlar</h3><p style="color:var(--text-muted);">Yazarların siyahısı tezliklə burada olacaq.</p>`;
            } else if (section === 'profile') {
                if (!currentUser) return openModal('authModal');
                main.innerHTML = `<h3>Profil: ${currentUser.name}</h3><p style="margin-top:0.5rem; color:var(--text-muted);">Məqalələriniz və qazancınız burada göstərilir.</p>`;
            }
        }

        function renderArticles(data) {
            const grid = document.getElementById('articlesGrid');
            if (!grid) return;
            grid.innerHTML = '';
            data.forEach(art => {
                const card = document.createElement('div');
                card.className = 'article-card';
                card.innerHTML = `
                    <img src="${art.image}" class="card-img" onclick="openArticle('${art.id}')">
                    <div class="card-body">
                        <div class="author-info">
                            <img src="${art.author.avatar}" class="avatar">
                            <div class="author-details">
                                <h4>${art.author.name}</h4>
                                <p>${art.date}</p>
                            </div>
                        </div>
                        <div class="card-title" onclick="openArticle('${art.id}')">${art.title}</div>
                        <div class="card-stats">
                            <span><i class="fa-solid fa-eye"></i> ${art.views}</span>
                            <button class="stat-btn" onclick="likeArticle('${art.id}', this)"><i class="fa-solid fa-thumbs-up"></i> <span>${art.likes}</span></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        let currentArticleId = null;
        function openArticle(id) {
            currentArticleId = id;
            const art = articles.find(a => a.id === id);
            if (!art) return;

            document.getElementById('videoAdContainer').classList.remove('hidden');
            document.getElementById('articleContent').classList.add('hidden');
            openModal('articleModal');

            let timeLeft = 3;
            const timerEl = document.getElementById('adTimer');
            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerEl.innerText = `Reklam: ${timeLeft} san`;
                } else {
                    clearInterval(countdown);
                    document.getElementById('videoAdContainer').classList.add('hidden');
                    document.getElementById('articleContent').classList.remove('hidden');
                    document.getElementById('modalTitle').innerText = art.title;
                    document.getElementById('modalAuthorImg').src = art.author.avatar;
                    document.getElementById('modalAuthorName').innerText = art.author.name;
                    document.getElementById('modalDate').innerText = art.date;
                    document.getElementById('modalImg').src = art.image;
                    document.getElementById('modalBodyText').innerText = art.body;
                    document.getElementById('modalLikeCount').innerText = art.likes;
                }
            }, 1000);
        }

        function likeArticle(id, btn) {
            const art = articles.find(a => a.id === id);
            art.likes++;
            btn.querySelector('span').innerText = art.likes;
            localStorage.setItem('articles', JSON.stringify(articles));
        }

        function likeCurrentArticle() {
            if (!currentArticleId) return;
            const art = articles.find(a => a.id === currentArticleId);
            art.likes++;
            document.getElementById('modalLikeCount').innerText = art.likes;
            localStorage.setItem('articles', JSON.stringify(articles));
        }

        function copyArticleLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Link kopyalandı!");
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function registerUser() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            if (!name) return alert("Adınızı daxil edin!");
            currentUser = { name, email };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            updateNav();
            closeModal('authModal');
        }

        function openCreateArticleModal() {
            if (!currentUser) return openModal('authModal');
            openModal('createModal');
        }

        function publishArticle() {
            const title = document.getElementById('createTitle').value;
            const body = document.getElementById('createBody').value;
            if (!title || !body) return alert("Bütün xanaları doldurun!");

            articles.unshift({
                id: 'art_' + Date.now(),
                title: title,
                body: body,
                image: 'https://picsum.photos/500/300',
                author: { name: currentUser.name, avatar: 'https://i.pravatar.cc/100?img=12' },
                views: 0,
                likes: 0,
                date: "İndi"
            });

            localStorage.setItem('articles', JSON.stringify(articles));
            closeModal('createModal');
            showSection('feed');
        }

        function searchArticles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = articles.filter(a => a.title.toLowerCase().includes(query));
            renderArticles(filtered);
        }
    </script>
</body>
</html>
