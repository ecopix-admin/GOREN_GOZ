<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>AzBoard RGB</title><script src="https://cdn.tailwindcss.com"></script>
<style>.key{transition:.15s;border:1px solid rgba(255,255,255,.1)}
.key.active{transform:scale(.92);box-shadow:0 0 25px currentColor}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none}
</style></head><body class="bg-[#0a0a0f] text-white p-4">
<div id="display" class="h-24 bg-black/50 border rounded-2xl p-4 mb-4"></div>
<div id="keyboard" class="bg-zinc-900 rounded-[2rem] p-4 border shadow-[0_0_50px_cyan]"></div>
<script>
const rows=[['1','2','3','4','5','6','7','8','9','0'],['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l','ə'],['z','x','c','v','b','n','m','ş','ç'],['123','space','⌫']];
const colors=['#ff00ff','#00ffff','#ffff00','#ff4400','#00ff88','#ff0066'];
const kb=document.getElementById('keyboard'), disp=document.getElementById('display');
let c=0;
function build(){rows.forEach(r=>{let row=document.createElement('div');row.className='flex gap-2 justify-center mb-2';r.forEach(k=>{let b=document.createElement('button');b.className='key flex-1 h-14 rounded-xl bg-zinc-800 font-bold';b.textContent=k==='space'?'BOŞLUQ':k.toUpperCase();b.style.color=colors[Math.random()*6|0];b.onclick=e=>{b.classList.add('active');setTimeout(()=>b.classList.remove('active'),200);if(k==='⌫')disp.textContent=disp.textContent.slice(0,-1);else if(k==='space')disp.textContent+=' ';else disp.textContent+=k;for(let i=0;i<8;i++){let p=document.createElement('div');p.className='particle';p.style.background=b.style.color;p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';document.body.appendChild(p);let a=Math.random()*6.28,d=50+Math.random()*60;p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}],{duration:600}).onfinish=()=>p.remove()}};row.appendChild(b)});kb.appendChild(row)})}build();
</script></body></html>
