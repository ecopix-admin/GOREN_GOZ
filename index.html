<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzSearch AI - Ağıllı Axtarış Portalı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Yuxarı Panel */
        header {
            background-color: #1e293b;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
            white-space: nowrap;
        }

        .logo span { color: #f43f5e; }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 650px;
        }

        .search-box {
            display: flex;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px 0 0 20px;
            border: 2px solid #334155;
            border-right: none;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input:focus { border-color: #38bdf8; }

        .search-box button {
            padding: 0 18px;
            border-radius: 0 20px 20px 0;
            border: 2px solid #38bdf8;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        /* Google Axtarış Təklifləri */
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
            overflow: hidden;
            margin-top: 2px;
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            color: #cbd5e1;
            font-size: 0.9rem;
            border-bottom: 1px solid #334155;
        }

        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background-color: #334155; color: #38bdf8; }

        /* Əsas Konteyner */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #fff;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
            background-color: #0f172a;
        }

        .welcome-screen h1 { color: #38bdf8; margin-bottom: 10px; }

        /* AI Cavab Bloku */
        #aiSummaryCard {
            display: none;
            background: #1e293b;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            margin: 10px;
            padding: 12px 15px;
            z-index: 10;
        }

        .ai-header {
            color: #38bdf8;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .ai-content {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e2e8f0;
        }

        /* Təmizlənmiş İframe Maskası */
        .iframe-wrapper {
            display: none;
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: calc(100% + 145px);
            margin-top: -145px; /* Yuxarıdakı bütün lazımsız çərçivələri kəsib təmizləyir */
            border: none;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="resetPage()">Az<span>Search</span> AI</a>
        <div class="search-container">
            <form class="search-box" onsubmit="executeSearch(event)">
                <input type="text" id="searchInput" placeholder="Axtarış edin..." autocomplete="off" oninput="fetchSuggestions(this.value)">
                <button type="submit">Axtar</button>
            </form>
            <div id="suggestionsBox" class="suggestions-box"></div>
        </div>
    </header>

    <main>
        <div class="welcome-screen" id="welcomeScreen">
            <h1>AzSearch AI Axtarış</h1>
            <p>Sizin peşəkar və müstəqil axtarış sisteminiz.</p>
        </div>

        <div id="aiSummaryCard">
            <div class="ai-header">🤖 AZSEARCH AI ANALİZİ</div>
            <div class="ai-content" id="aiContent">Yüklənir...</div>
        </div>

        <!-- Maskalanmış Çərçivə -->
        <div class="iframe-wrapper" id="iframeWrapper">
            <iframe id="resultsFrame"></iframe>
        </div>
    </main>

    <script>
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');

        function fetchSuggestions(query) {
            query = query.trim();
            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const script = document.createElement('script');
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=showSuggestions`;
            document.body.appendChild(script);
        }

        function showSuggestions(data) {
            const results = data[1];
            if (!results || results.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            suggestionsBox.innerHTML = '';
            results.slice(0, 6).forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerText = item;
                div.onclick = () => {
                    searchInput.value = item;
                    suggestionsBox.style.display = 'none';
                    runSearch(item);
                };
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                suggestionsBox.style.display = 'none';
            }
        });

        function executeSearch(event) {
            event.preventDefault();
            suggestionsBox.style.display = 'none';
            runSearch(searchInput.value.trim());
        }

        function runSearch(query) {
            if (!query) return;

            document.getElementById('welcomeScreen').style.display = 'none';
            const aiCard = document.getElementById('aiSummaryCard');
            const aiContent = document.getElementById('aiContent');
            const iframeWrapper = document.getElementById('iframeWrapper');
            const resultsFrame = document.getElementById('resultsFrame');

            aiCard.style.display = 'block';
            aiContent.innerHTML = '<i>Süni intellekt məlumatları analiz edir...</i>';

            const wikiUrl = `https://az.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;

            fetch(wikiUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.extract) {
                        aiContent.innerHTML = `<strong>Ağıllı Xülasə:</strong> ${data.extract}`;
                    } else {
                        aiContent.innerHTML = `<strong>AI Təhlili:</strong> "${query}" haqqında əsas nəticələr və elanlar aşağıda təqdim olundu.`;
                    }
                })
                .catch(() => {
                    aiContent.innerHTML = `<strong>AI Təhlili:</strong> "${query}" sorğusu üzrə nəticələr hazırlandı.`;
                });

            iframeWrapper.style.display = 'block';
            resultsFrame.src = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
        }

        function resetPage() {
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('aiSummaryCard').style.display = 'none';
            document.getElementById('iframeWrapper').style.display = 'none';
            searchInput.value = '';
        }
    </script>
</body>
</html>
