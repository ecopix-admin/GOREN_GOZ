<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure P2P Chat Network</title>
    <!-- PeerJS CDN: P2P Video/Audio və Data əlaqəsi üçün -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- FontAwesome Iconlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: #111b21;
            --chat-bg: #0d1418;
            --message-out: #005c4b;
            --message-in: #202c33;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --accent: #00a884;
            --accent-hover: #06cf9c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            background: var(--panel-bg);
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Sol Panel - İd və Kontaktlar */
        .sidebar {
            width: 320px;
            border-right: 1px solid #222d34;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
        }

        .user-profile {
            padding: 15px;
            background: #202c33;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-id-box {
            background: #111b21;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            word-break: break-all;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 4px;
        }

        .connect-box {
            padding: 15px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #222d34;
        }

        .connect-box input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #222d34;
            background: #111b21;
            color: #fff;
            outline: none;
        }

        .connect-box button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #222d34;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-item:hover, .chat-item.active {
            background: #202c33;
        }

        /* Sağ Panel - Çat Ərazisi */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            background: #202c33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 1px solid #222d34;
        }

        .call-actions {
            display: flex;
            gap: 15px;
        }

        .call-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .call-btn:hover {
            color: var(--accent);
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            position: relative;
            word-wrap: break-word;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--message-out);
        }

        .message.received {
            align-self: flex-start;
            background: var(--message-in);
        }

        .message img, .message video {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
        }

        .message audio {
            margin-top: 5px;
            width: 250px;
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 4px;
        }

        /* Giriş Paneli (İnput) */
        .input-area {
            padding: 10px 15px;
            background: #202c33;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #2a3942;
            color: #fff;
            outline: none;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .action-btn:hover {
            color: var(--accent);
        }

        .action-btn.recording {
            color: #ff4b4b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Video Zəng Konteyneri overlay */
        .video-call-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 20, 26, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .video-grid {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-grid video {
            width: 350px;
            height: 260px;
            background: #000;
            border-radius: 10px;
            object-fit: cover;
        }

        .end-call-btn {
            background: #ff4b4b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sol Panel: İstifadəçi Məlumatı və Kontakt Yığma -->
    <div class="sidebar">
        <div class="user-profile">
            <span>Sizin Məxfi İD Ünvanınız:</span>
            <div class="user-id-box">
                <strong id="my-peer-id">Yüklənir...</strong>
                <button class="copy-btn" onclick="copyMyId()" title="Kopyala"><i class="fa-regular fa-copy"></i></button>
            </div>
        </div>

        <div class="connect-box">
            <input type="text" id="remote-id-input" placeholder="Qarşı tərəfin İD-si...">
            <button onclick="connectToPeer()"><i class="fa-solid fa-user-plus"></i></button>
        </div>

        <div class="chat-list" id="chat-list">
            <div class="chat-item active" id="active-chat-item" style="display:none;">
                <i class="fa-solid fa-user-lock" style="font-size: 1.5rem; color: var(--accent);"></i>
                <div>
                    <div id="active-peer-name" style="font-weight:bold;">Təhlükəsiz Kanal</div>
                    <div style="font-size:0.75rem; color: var(--text-muted);">P2P Şifrələnib</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sağ Panel: Əsas Çat Şəbəkəsi -->
    <div class="chat-area">
        <div class="chat-header">
            <div>
                <h4 id="chat-title">Təhlükəsiz Çat Bölməsi</h4>
                <small id="status-text" style="color: var(--text-muted);">Əlaqə yoxdur</small>
            </div>
            <div class="call-actions">
                <button class="call-btn" onclick="startCall(false)" title="Səsli Zəng"><i class="fa-solid fa-phone"></i></button>
                <button class="call-btn" onclick="startCall(true)" title="Video Zəng"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>

        <!-- Mesajların Siyahısı -->
        <div class="messages-container" id="messages-container"></div>

        <!-- Məlumat Daxiletmə Paneli -->
        <div class="input-area">
            <!-- Qalereya / Şəkil və Video Göndərmə -->
            <button class="action-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
            <input type="file" id="file-input" accept="image/*,video/*" onchange="sendFile(this.files[0])">

            <!-- Mətn Mesajı -->
            <input type="text" id="message-input" placeholder="Şifrələnmiş mesaj yazın..." onkeypress="handleKeyPress(event)">

            <!-- Səsli Mesaj Düyməsi -->
            <button class="action-btn" id="record-btn" onclick="toggleAudioRecord()"><i class="fa-solid fa-microphone"></i></button>

            <!-- Göndər Düyməsi -->
            <button class="action-btn" style="color: var(--accent);" onclick="sendTextMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <!-- Video Zəng Modalı -->
        <div class="video-call-overlay" id="video-overlay">
            <div class="video-grid">
                <video id="local-video" autoplay muted></video>
                <video id="remote-video" autoplay></video>
            </div>
            <button class="end-call-btn" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i> Zəngi Bitir</button>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let conn = null;
    let currentCall = null;
    let localStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // 1. Peer Obyektinin Yaradılması və Sistem Quraşdırılması
    function initPeer() {
        peer = new Peer();

        peer.on('open', (id) => {
            document.getElementById('my-peer-id').innerText = id;
        });

        // Daxil olan mesaj əlaqəsi
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnectionListeners();
        });

        // Daxil olan səsli/videolu zəng
        peer.on('call', (call) => {
            if (confirm("Gələn zəng var! Qəbul edirsiniz?")) {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                    localStream = stream;
                    document.getElementById('local-video').srcObject = stream;
                    document.getElementById('video-overlay').style.display = 'flex';
                    
                    call.answer(stream);
                    currentCall = call;

                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                    });
                });
            }
        });
    }

    // 2. Başqa İD-yə Qoşulmaq
    function connectToPeer() {
        const remoteId = document.getElementById('remote-id-input').value.trim();
        if (!remoteId) return alert("Xahiş olunur qarşı tərəfin İD-sini daxil edin!");

        conn = peer.connect(remoteId);
        setupConnectionListeners();
    }

    // 3. Əlaqə Dinləyicilərinin Tənzimlənməsi
    function setupConnectionListeners() {
        conn.on('open', () => {
            document.getElementById('status-text').innerText = 'Təhlükəsiz Kanal Yaradıldı (P2P E2EE Active)';
            document.getElementById('status-text').style.color = 'var(--accent)';
            document.getElementById('active-chat-item').style.display = 'flex';
            document.getElementById('active-peer-name').innerText = "Kanal: " + conn.peer.substring(0, 8) + "...";
        });

        conn.on('data', (data) => {
            renderIncomingData(data);
        });

        conn.on('close', () => {
            document.getElementById('status-text').innerText = 'Əlaqə kəsildi';
            document.getElementById('status-text').style.color = '#ff4b4b';
        });
    }

    // 4. Mətn Mesajı Göndərmə
    function sendTextMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !conn) return;

        const payload = { type: 'text', content: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
        conn.send(payload);
        appendMessage(payload, 'sent');
        input.value = '';
    }

    // 5. Fayl Göndərmə (Foto və Video qalereyadan)
    function sendFile(file) {
        if (!file || !conn) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const fileType = file.type.startsWith('image/') ? 'image' : 'video';
            const payload = {
                type: fileType,
                content: e.target.result,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };
            conn.send(payload);
            appendMessage(payload, 'sent');
        };
        reader.readAsDataURL(file);
    }

    // 6. Səsli Mesaj Yazma və Göndərmə
    async function toggleAudioRecord() {
        const btn = document.getElementById('record-btn');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const payload = {
                            type: 'audio',
                            content: e.target.result,
                            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                        };
                        conn.send(payload);
                        appendMessage(payload, 'sent');
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } catch (err) {
                alert("Mikrofon icazəsi verilmədi.");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.remove('recording');
        }
    }

    // 7. Video və Səsli Zəngin Başladılması
    function startCall(isVideo) {
        if (!conn) return alert("Əvvəlcə qarşı tərəfə qoşulun!");

        navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }).then((stream) => {
            localStream = stream;
            document.getElementById('local-video').srcObject = stream;
            document.getElementById('video-overlay').style.display = 'flex';

            const call = peer.call(conn.peer, stream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        });
    }

    function endCall() {
        if (currentCall) currentCall.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        document.getElementById('video-overlay').style.display = 'none';
    }

    // 8. Mesajların Ekranda Göstərilməsi
    function renderIncomingData(data) {
        appendMessage(data, 'received');
    }

    function appendMessage(data, side) {
        const container = document.getElementById('messages-container');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${side}`;

        let innerContent = '';
        if (data.type === 'text') {
            innerContent = `<div>${escapeHtml(data.content)}</div>`;
        } else if (data.type === 'image') {
            innerContent = `<img src="${data.content}" alt="Görünş">`;
        } else if (data.type === 'video') {
            innerContent = `<video src="${data.content}" controls></video>`;
        } else if (data.type === 'audio') {
            innerContent = `<audio src="${data.content}" controls></audio>`;
        }

        msgDiv.innerHTML = `${innerContent}<div class="message-time">${data.time}</div>`;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendTextMessage();
    }

    function copyMyId() {
        const idText = document.getElementById('my-peer-id').innerText;
        navigator.clipboard.writeText(idText);
        alert("Sizin məxfi P2P İD-niz kopyalandı!");
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Tətbiqi işə sal
    window.onload = initPeer;
</script>
</body>
</html>
