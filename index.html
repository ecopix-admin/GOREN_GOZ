<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uşaq Macəra Dünyası</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: #2b2d42;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
        }

        /* Başlıq Və Menyular */
        .header {
            background: #ffb703;
            padding: 15px;
            text-align: center;
            color: #d90429;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .home-btn {
            background: #ef233c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        /* Ana Menyu */
        .game-card {
            width: 100%;
            background: #8d99ae;
            margin: 10px 0;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 3px solid #edf2f4;
        }

        .game-card:hover {
            transform: scale(1.03);
            background: #ffb703;
        }

        .game-icon {
            font-size: 40px;
            background: white;
            padding: 10px;
            border-radius: 12px;
        }

        .game-info h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .game-info p {
            color: #edf2f4;
            font-size: 12px;
        }

        /* Oyun Kanvasları */
        canvas {
            background: #111;
            border-radius: 10px;
            width: 100%;
            height: 100%;
            max-height: 400px;
        }

        /* Yaddaş Oyunu Grid */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
        }

        .memory-card {
            aspect-ratio: 1;
            background: #ffb703;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .memory-card.flipped {
            background: #fff;
            transform: rotateY(180deg);
        }

        /* Nəticə vərəqi */
        .score-board {
            color: white;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="header">
            <span id="header-title">🎮 Macəra Parkı</span>
            <button class="home-btn" onclick="showScreen('menu-screen')">Menyu</button>
        </div>

        <!-- ANA MENYU -->
        <div id="menu-screen" class="screen active">
            <div class="game-card" onclick="startSpaceGame()">
                <div class="game-icon">🚀</div>
                <div class="game-info">
                    <h3>Kosmik Kosmonavt</h3>
                    <p>Meteoritlərdən qaç, ulduzları topla!</p>
                </div>
            </div>

            <div class="game-card" onclick="startMemoryGame()">
                <div class="game-icon">🧩</div>
                <div class="game-info">
                    <h3>Sehrli Yaddaş</h3>
                    <p>Gizli cütləri tap və qalib gəl!</p>
                </div>
            </div>

            <div class="game-card" onclick="startCatchGame()">
                <div class="game-icon">🍎</div>
                <div class="game-info">
                    <h3>Xəzinə Tutmaç</h3>
                    <p>Meyvələri səbətə yığ, bombalardan qaç!</p>
                </div>
            </div>
        </div>

        <!-- OYUN 1: KOSMİK KOSMONAVT -->
        <div id="space-screen" class="screen">
            <div class="score-board">Xal: <span id="space-score">0</span></div>
            <canvas id="spaceCanvas"></canvas>
            <p style="color: #aaa; font-size: 12px; margin-top: 10px;">İdarə: Ekrana vuraraq gəmini hərəkət etdirin</p>
        </div>

        <!-- OYUN 2: SEHRLİ YADDAŞ -->
        <div id="memory-screen" class="screen">
            <div class="score-board">Cütlər: <span id="memory-score">0</span>/6</div>
            <div class="memory-grid" id="memoryGrid"></div>
        </div>

        <!-- OYUN 3: XƏZİNƏ TUTMAÇ -->
        <div id="catch-screen" class="screen">
            <div class="score-board">Xal: <span id="catch-score">0</span></div>
            <canvas id="catchCanvas"></canvas>
            <p style="color: #aaa; font-size: 12px; margin-top: 10px;">İdarə: Barmağınızla səbəti sürüşdürün</p>
        </div>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            stopAllGames();
        }

        function stopAllGames() {
            clearInterval(spaceInterval);
            clearInterval(catchInterval);
        }

        /* --- OYUN 1: KOSMİK KOSMONAVT --- */
        let spaceCanvas = document.getElementById('spaceCanvas');
        let spaceCtx = spaceCanvas.getContext('2d');
        let spaceInterval, spaceScore = 0;
        let shipX = 150;
        let stars = [];

        function startSpaceGame() {
            showScreen('space-screen');
            spaceCanvas.width = 320;
            spaceCanvas.height = 350;
            spaceScore = 0;
            shipX = 140;
            stars = [];
            document.getElementById('space-score').innerText = spaceScore;

            spaceCanvas.onclick = (e) => {
                let rect = spaceCanvas.getBoundingClientRect();
                let clickX = e.clientX - rect.left;
                if (clickX < spaceCanvas.width / 2) shipX -= 30;
                else shipX += 30;
            };

            spaceInterval = setInterval(updateSpaceGame, 50);
        }

        function updateSpaceGame() {
            spaceCtx.clearRect(0, 0, spaceCanvas.width, spaceCanvas.height);
            
            // Kosmik Gəmi
            spaceCtx.font = "30px Arial";
            spaceCtx.fillText("🚀", shipX, 320);

            // Ulduzlar generatoru
            if(Math.random() < 0.1) {
                stars.push({x: Math.random() * 280, y: 0});
            }

            for(let i = 0; i < stars.length; i++) {
                stars[i].y += 5;
                spaceCtx.fillText("⭐", stars[i].x, stars[i].y);

                // Dəymə yoxlanışı
                if(stars[i].y > 290 && Math.abs(stars[i].x - shipX) < 30) {
                    spaceScore += 10;
                    document.getElementById('space-score').innerText = spaceScore;
                    stars.splice(i, 1);
                }
            }
        }

        /* --- OYUN 2: SEHRLİ YADDAŞ --- */
        const icons = ['🐶', '🐱', '🦊', '🦁', '🐸', '🦄'];
        let memoryCards = [];
        let flippedCards = [];
        let matchedPairs = 0;

        function startMemoryGame() {
            showScreen('memory-screen');
            matchedPairs = 0;
            document.getElementById('memory-score').innerText = matchedPairs;
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            
            memoryCards = [...icons, ...icons].sort(() => Math.random() - 0.5);
            memoryCards.forEach((icon, index) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.icon = icon;
                card.dataset.index = index;
                card.onclick = () => flipMemoryCard(card);
                grid.appendChild(card);
            });
        }

        function flipMemoryCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
                card.classList.add('flipped');
                card.innerText = card.dataset.icon;
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    setTimeout(checkMemoryMatch, 800);
                }
            }
        }

        function checkMemoryMatch() {
            if (flippedCards[0].dataset.icon === flippedCards[1].dataset.icon) {
                matchedPairs++;
                document.getElementById('memory-score').innerText = matchedPairs;
                if(matchedPairs === 6) alert('Təbrik edirik! Bütün cütləri tapdınız! 🎉');
            } else {
                flippedCards[0].classList.remove('flipped');
                flippedCards[0].innerText = '';
                flippedCards[1].classList.remove('flipped');
                flippedCards[1].innerText = '';
            }
            flippedCards = [];
        }

        /* --- OYUN 3: XƏZİNƏ TUTMAÇ --- */
        let catchCanvas = document.getElementById('catchCanvas');
        let catchCtx = catchCanvas.getContext('2d');
        let catchInterval, catchScore = 0;
        let basketX = 130;
        let fruits = [];

        function startCatchGame() {
            showScreen('catch-screen');
            catchCanvas.width = 320;
            catchCanvas.height = 350;
            catchScore = 0;
            fruits = [];
            document.getElementById('catch-score').innerText = catchScore;

            catchCanvas.onmousemove = (e) => {
                let rect = catchCanvas.getBoundingClientRect();
                basketX = e.clientX - rect.left - 20;
            };

            catchCanvas.ontouchmove = (e) => {
                let rect = catchCanvas.getBoundingClientRect();
                basketX = e.touches[0].clientX - rect.left - 20;
            };

            catchInterval = setInterval(updateCatchGame, 40);
        }

        function updateCatchGame() {
            catchCtx.clearRect(0, 0, catchCanvas.width, catchCanvas.height);

            // Səbət
            catchCtx.font = "35px Arial";
            catchCtx.fillText("🧺", basketX, 330);

            // Meyvə düşməsi
            if(Math.random() < 0.08) {
                fruits.push({x: Math.random() * 280, y: 0, type: Math.random() > 0.2 ? "🍎" : "💣"});
            }

            for(let i = 0; i < fruits.length; i++) {
                fruits[i].y += 4;
                catchCtx.fillText(fruits[i].type, fruits[i].x, fruits[i].y);

                // Tutmağını yoxla
                if(fruits[i].y > 300 && Math.abs(fruits[i].x - basketX) < 35) {
                    if(fruits[i].type === "🍎") {
                        catchScore += 5;
                    } else {
                        catchScore = Math.max(0, catchScore - 10);
                    }
                    document.getElementById('catch-score').innerText = catchScore;
                    fruits.splice(i, 1);
                }
            }
        }
    </script>
</body>
</html>
